<style>
/* ===== Academy colours and font: change them here ===== */
:root{
  /* Exact Almuñécar Tennis Academy palette (tailwind.config.js) */
  --navy:#12294A; --navy-2:#0B1B33; --navy-3:#1A3760;
  --orange:#E35B2A; --orange-hover:#CC5224; --orange-soft:#FCEDE6;
  --bg:#FBFAF8; --card:#FFFFFF; --ink:#0F1720; --muted:#546073; --line:#E0E2E8;
  --ok:#1F9D6B;
  --radius:16px;
  --font:'Figtree',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  /* Motion: same curves as the academy site */
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  /* Safe areas (notch, Dynamic Island, home indicator) */
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
html.dark-top{background:var(--navy-2)}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior-y:none;text-rendering:optimizeLegibility}
button,a,input,textarea,[data-act]{touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;border-radius:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(18px,var(--sal));padding-right:max(18px,var(--sar))}
.brand{font-size:11px;letter-spacing:.18em;font-weight:700;text-transform:uppercase;line-height:1.4}
.logo-word{display:block;width:210px;max-width:70%;height:auto}
.logo-mono{display:block;height:34px;width:auto}
.topbrand{display:flex;align-items:center;gap:10px}
.topbrand span{font-size:11px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;color:var(--muted)}
.hero .wm{position:absolute;left:22px;top:22px;height:30px;width:auto;opacity:.16}

/* ===== Press feedback: every tappable thing answers instantly ===== */
.btn,.player,.action,.emo button,.chips button,.choices button,.wz-bar .x,.link{transition:transform 160ms var(--ease-out),background-color 160ms ease,border-color 160ms ease,color 160ms ease}
.btn:active,.player:active,.action:active,.wz-bar .x:active{transform:scale(.97)}
.emo button:active,.chips button:active,.choices button:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){
  .btn-orange:hover{background:var(--orange-hover)}
  .action:hover{border-color:#CBD0DA}
  .chips button:not(.on):hover,.choices button:not(.on):hover,.emo button:not(.on):hover{border-color:#CBD0DA}
  .player:not(.sel):hover{background:rgba(255,255,255,.1)}
  .link:hover{color:var(--ink)}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 28px;border-radius:999px;font-weight:700;font-size:17px}
.btn-orange{background:var(--orange);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-block{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.link{font-size:15px;font-weight:600;color:var(--muted);padding:10px 4px;margin-right:-4px;min-height:44px}

/* ===== Login ===== */
.login{min-height:100vh;min-height:100dvh;background:radial-gradient(120% 70% at 100% 0%,var(--navy) 0%,var(--navy-2) 70%);color:#fff;padding:calc(28px + var(--sat)) 0 calc(32px + var(--sab));position:relative;overflow:hidden;display:flex;flex-direction:column}
.login .wrap{position:relative;z-index:1;width:100%;flex:1;display:flex;flex-direction:column}
.login .court{position:absolute;right:-120px;top:calc(120px + var(--sat));width:360px;height:360px;border:2px solid rgba(227,91,42,.25);border-radius:50%;pointer-events:none}
.login .court:after{content:"";position:absolute;inset:40px;border:2px solid rgba(255,255,255,.06);border-radius:50%}
.login h1{font-size:clamp(40px,12vw,52px);line-height:1;font-weight:700;letter-spacing:-.03em;margin:clamp(36px,8vh,72px) 0 14px}
.login h1 span{color:var(--orange)}
.login .lead{color:rgba(255,255,255,.72);font-size:16px;line-height:1.55;max-width:34ch}
.players{display:grid;gap:12px;margin-top:36px}
.player{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);text-align:left;color:#fff;width:100%;min-height:72px}
.player.sel{background:#fff;color:var(--navy);border-color:#fff}
.player .nm{font-weight:700;font-size:18px}
.player .sub{font-size:13px;opacity:.6}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.pinbox{margin-top:22px;display:none}
.pinbox.show{display:block;animation:rise 260ms var(--ease-out) both}
.pinbox label{font-size:13px;color:rgba(255,255,255,.7);font-weight:600;display:block;margin-bottom:8px}
.pin{width:100%;height:64px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;font-size:28px;letter-spacing:.6em;text-indent:.6em;text-align:center;font-weight:700;margin-bottom:14px;transition:border-color 160ms ease}
.pin:focus{border-color:var(--orange)}
.pin:focus-visible,.txt:focus-visible,textarea:focus-visible{outline:none}
.pin.shake{animation:shake 320ms var(--ease-out)}
.logo-club{display:block;width:120px;height:auto;margin:16px auto 0;opacity:.45}
.motto{margin-top:auto;padding-top:40px;font-size:13px;color:rgba(255,255,255,.45);line-height:1.5}

/* ===== Home ===== */
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + var(--sat)) 0 14px}
.hero{background:var(--navy);color:#fff;border-radius:24px;padding:26px 24px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(227,91,42,.35)}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:2px solid rgba(255,255,255,.08)}
.hero .date{font-size:13px;color:rgba(255,255,255,.6);font-weight:500}
.hero h2{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 0 16px;line-height:1.1}
.hero h2 span{color:var(--orange)}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1;max-width:calc(100% - 56px)}
.pill{font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-variant-numeric:tabular-nums}
.pill.o{background:var(--orange)}
.actions{display:grid;gap:12px;margin:16px 0 0}
.action{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid var(--line);text-align:left;width:100%;box-shadow:0 1px 2px rgba(15,23,32,.04)}
.action .ic{width:52px;height:52px;border-radius:14px;background:var(--orange-soft);display:grid;place-items:center;font-size:24px;flex:none}
.action h3{font-size:17px;font-weight:700}
.action p{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.35}
.action .arr{margin-left:auto;color:var(--orange);font-size:24px;font-weight:700;padding-left:4px}
.action .draft{font-size:12px;font-weight:700;color:var(--orange);margin-top:4px}
.stitle{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 8px;min-width:0}
.stat .k{font-size:11px;color:var(--muted);font-weight:600;line-height:1.25;min-height:2.5em}
.stat .v{font-size:26px;font-weight:700;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--muted);font-weight:600}
.stat svg{display:block;width:100%;height:28px}
.hist{margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.hist summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:60px}
.hist summary::-webkit-details-marker{display:none}
.hist summary:after{content:"›";margin-left:auto;color:var(--muted);font-size:20px;transition:transform 200ms var(--ease-out)}
.hist[open] summary:after{transform:rotate(90deg)}
.hist .when{font-size:12px;color:var(--muted);font-weight:500}
.hist .ind{font-size:14px;font-weight:600;margin-top:2px}
.hist[open] summary{border-bottom:1px solid var(--line)}
.hist[open] .detail{animation:fade 200ms var(--ease-out)}
.tag{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--orange-soft);color:var(--orange);white-space:nowrap}
.tag.n{background:var(--navy);color:#fff}
.tag.g{background:#E8F6F0;color:var(--ok)}
.detail{padding:6px 16px 14px}
.detail h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin:14px 0 6px}
.row{padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.row:last-child{border-bottom:0}
.row .l{color:var(--muted);font-size:12px;font-weight:600;display:block}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
.pending{margin-top:14px;font-size:14px;background:#FFF8E6;color:#8A5A00;border-radius:14px;padding:10px 14px}
.foot{padding:30px 0 calc(40px + var(--sab));text-align:center}

/* Staggered entry on home: only when arriving, never on silent refresh */
.enter .hero,.enter .action,.enter .stitle,.enter .stats,.enter .hist,.enter .empty{animation:rise 360ms var(--ease-out) both}
.enter .action:nth-child(1){animation-delay:50ms}
.enter .action:nth-child(2){animation-delay:90ms}
.enter .action:nth-child(3){animation-delay:130ms}
.enter .stitle,.enter .stats,.enter .hist,.enter .empty{animation-delay:170ms}

/* ===== Form ===== */
.wz-top{position:sticky;top:0;background:rgba(251,250,248,.86);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);padding:calc(12px + var(--sat)) 0 10px;z-index:5;margin:0 calc(-1 * max(18px,var(--sar))) 0 calc(-1 * max(18px,var(--sal)));padding-left:max(18px,var(--sal));padding-right:max(18px,var(--sar))}
.wz-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wz-bar .x{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.wz-bar .t{font-size:14px;font-weight:700;flex:1}
.wz-bar .c{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:100%;background:var(--orange);border-radius:9px;transform-origin:left;transition:transform 300ms var(--ease-out)}
.step h2{font-size:clamp(26px,8vw,32px);font-weight:700;letter-spacing:-.025em;line-height:1.08;margin:18px 0 8px}
.step .help{color:var(--muted);font-size:15px;line-height:1.5}
.step.fwd{animation:inR 240ms var(--ease-out) both}
.step.bwd{animation:inL 240ms var(--ease-out) both}
.field{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px}
.field .q{display:block;font-weight:700;font-size:16px;line-height:1.35;margin-bottom:12px}
.field .q .opt{font-weight:500;color:var(--muted);font-size:12px}
.field .fhelp{font-size:13px;color:var(--muted);margin:-6px 0 12px;line-height:1.45}
.field.miss{border-color:var(--orange);animation:shake 320ms var(--ease-out)}
.sl-val{font-size:44px;font-weight:700;color:var(--orange);text-align:center;line-height:1;margin-bottom:14px;font-variant-numeric:tabular-nums}
.sl-val small{font-size:16px;color:var(--muted)}
.sl-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:10px;font-weight:500}
input[type=range]{width:100%;height:36px;background:transparent;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:9px;background:linear-gradient(to right,var(--orange) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:8px;border-radius:9px;background:linear-gradient(to right,var(--orange) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:32px;height:32px;margin-top:-12px;border-radius:50%;background:#fff;border:3px solid var(--orange);box-shadow:0 2px 8px rgba(15,23,32,.2);transition:transform 160ms var(--ease-out)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--orange);box-shadow:0 2px 8px rgba(15,23,32,.2)}
.emo{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.emo button{flex:0 0 calc((100% - 16px) / 3)}
@media (max-width:360px){ .emo button{flex-basis:calc((100% - 8px) / 2)} }
.emo button{border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center;line-height:1.25;min-height:84px;justify-content:center}
.emo button span{font-size:28px;line-height:1}
.emo button.on{border-color:var(--orange);background:var(--orange-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 15px;border-radius:999px;border:1.5px solid var(--line);font-size:15px;font-weight:600;min-height:44px}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.choices{display:grid;gap:8px}
.choices button{padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);text-align:left;font-weight:600;font-size:16px;min-height:52px}
.choices button.on{border-color:var(--orange);background:var(--orange-soft)}
.txt,textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:16px;background:#fff;resize:vertical;line-height:1.45;transition:border-color 160ms ease}
textarea{min-height:96px;field-sizing:content;max-height:280px}
.txt:focus,textarea:focus{border-color:var(--orange)}
::placeholder{color:#9AA3B2}
.plan{background:var(--navy);color:#fff;border-radius:var(--radius);padding:18px;margin-top:14px}
.plan .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700;margin:10px 0 4px}
.plan .k:first-child{margin-top:0}
.plan p{font-size:15px;line-height:1.5;color:rgba(255,255,255,.88)}
.wz-foot{position:sticky;bottom:0;padding:22px 0 calc(14px + max(var(--sab),6px));background:linear-gradient(to bottom,rgba(251,250,248,0),var(--bg) 35%);margin-top:6px;z-index:5}

/* ===== Done ===== */
.done{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(40px + var(--sat)) 0 calc(40px + var(--sab))}
.done > *{animation:rise 400ms var(--ease-out) both}
.done > *:nth-child(2){animation-delay:60ms}.done > *:nth-child(3){animation-delay:110ms}
.done > *:nth-child(4){animation-delay:160ms}.done > *:nth-child(5){animation-delay:210ms}.done > *:nth-child(6){animation-delay:260ms}
.done .ball{width:84px;height:84px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:40px;font-weight:700;margin-bottom:26px;animation:pop 460ms var(--ease-out) both}
.done h2{font-size:clamp(30px,9vw,36px);font-weight:700;letter-spacing:-.025em;line-height:1.08}
.done p{color:var(--muted);font-size:17px;line-height:1.55;margin-top:12px}
.done .words{margin-top:22px;background:var(--navy);color:#fff;border-radius:var(--radius);padding:20px}
.done .words .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700}
.done .words .w{font-size:22px;font-weight:700;margin-top:6px;line-height:1.3;overflow-wrap:anywhere}
.status{margin-top:18px;font-size:14px;font-weight:600}
.status.ok{color:var(--ok)} .status.wait{color:#8A5A00}

/* Toast: drops from the top (never hidden by the iOS keyboard), leaves faster than it arrives */
.toast{position:fixed;left:50%;top:calc(12px + var(--sat));transform:translate(-50%,-12px) scale(.96);background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity 150ms ease,transform 150ms ease;pointer-events:none;z-index:50;max-width:min(90vw,420px);text-align:center;box-shadow:0 8px 24px rgba(15,23,32,.18)}
html.dark-top .toast{background:#fff;color:var(--navy)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);transition:opacity 220ms var(--ease-out),transform 260ms var(--ease-out)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes inR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.fade{animation:fade 240ms var(--ease-out)}

/* ===== Centred layout (web + mobile) ===== */
.login .wrap{align-items:center;text-align:center}
.logo-word{margin:0 auto}
.login .lead{margin:0 auto}
.players,.pinbox{width:100%;max-width:420px;margin-left:auto;margin-right:auto}
.player{justify-content:center;text-align:left}
.pinbox label{text-align:center}
.hero{text-align:center}
.hero .pillrow{justify-content:center;max-width:none;margin:0 auto}
.stitle{text-align:center;display:flex;justify-content:center;align-items:baseline;gap:8px}
.step h2,.step .help{text-align:center}
.step .help{max-width:42ch;margin:0 auto}
.field .q,.field .fhelp{text-align:center}
.chips{justify-content:center}
.choices button{text-align:center}
.sl-ends{text-align:center}
.wz-bar .t{text-align:center}
.wz-bar .c{width:44px;text-align:right}
.done{align-items:center;text-align:center}
.done p{margin-left:auto;margin-right:auto;max-width:36ch}
.done .words,.done .status,.done > div:last-child{width:100%;max-width:420px}
.foot{display:flex;flex-direction:column;align-items:center}
.filters{margin-bottom:12px}

/* ===== Game profile ===== */
.profile{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px}
.phead{font-size:12px;color:var(--muted);text-align:center;margin-bottom:6px}
.prow{padding:10px 0;border-bottom:1px dashed var(--line)}
.prow:last-of-type{border-bottom:0}
.pl{display:flex;align-items:baseline;gap:8px;font-size:15px;font-weight:600}
.pl span{flex:1}
.pl b{font-size:18px;font-variant-numeric:tabular-nums}
.pl em{font-style:normal;font-size:12px;font-weight:700;padding:2px 7px;border-radius:999px;font-variant-numeric:tabular-nums}
.pl em.up{background:#E8F6F0;color:var(--ok)} .pl em.down{background:var(--orange-soft);color:var(--orange)}
.ptrack{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin-top:6px}
.ptrack i{display:block;height:100%;width:100%;background:var(--navy);border-radius:9px;transform-origin:left}
.pnote{font-size:13px;color:var(--muted);margin-top:6px;line-height:1.45;overflow-wrap:anywhere}
.pmeta{font-size:14px;padding:8px 0 0;line-height:1.4}
.pmeta span{display:block;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);font-weight:700}
.profile .btn{margin-top:14px}
.btn-ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.wk{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 8px;font-size:13px;font-weight:700}
.wk small{font-size:12px;color:var(--muted);font-weight:600}
.empty .btn{margin-top:4px}

/* ===== v2: week dots, intro, challenge, coach rating ===== */
.weekdots{display:flex;justify-content:center;gap:10px;margin:2px 0 14px;position:relative;z-index:1}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;font-weight:700;color:rgba(255,255,255,.5)}
.wd i{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.3)}
.wd.on i{background:var(--orange);border-color:var(--orange)}
.wd.today{color:#fff}
.wd.today i{box-shadow:0 0 0 3px rgba(255,255,255,.15)}
.intro h1{margin-top:28px}
.logo-mono-w{height:44px;width:auto;margin:0 auto;display:block}
.rules{display:grid;gap:10px;margin:24px 0 26px;width:100%;max-width:440px;text-align:left}
.rules div{display:flex;gap:12px;align-items:flex-start;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:12px 14px}
.rules b{font-size:22px;line-height:1.2}
.rules p{font-size:14.5px;line-height:1.45;color:rgba(255,255,255,.85);max-width:none}
.rules strong{color:#fff}
.intro .btn{max-width:440px}
.challenge{background:var(--card);border:2px solid var(--navy);border-radius:var(--radius);padding:16px;margin-top:16px;text-align:center}
.ch-k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700}
.challenge p{font-size:18px;font-weight:700;line-height:1.35;margin:6px auto 4px}
.challenge small{font-size:12px;color:var(--muted)}
.cheditor{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px}
.chrow{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:10px}
.chrow .btn{padding:0 22px}
.link.inline{min-height:0;padding:0;font-size:12px;color:var(--navy);text-decoration:underline}
.fine{font-size:12px;color:var(--muted);text-align:center;margin:10px auto 0;line-height:1.45}
.mt8{margin-top:10px}
.levels{background:var(--navy);color:#fff;border-radius:var(--radius);padding:16px;margin-top:14px;text-align:left}
.levels .lv-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700;text-align:center;margin-bottom:8px}
.levels div:not(.lv-h){display:flex;flex-direction:column;padding:6px 0;border-bottom:1px solid rgba(255,255,255,.08)}
.levels b{font-size:15px}
.levels span{font-size:13px;color:rgba(255,255,255,.75);margin-top:1px}
.levels p{font-size:13px;color:rgba(255,255,255,.75);margin-top:10px;text-align:center}
.action.done-today{border-color:#BFE5D3;background:#F3FBF7}
.action.done-today .ic{background:#E3F5EC}
.action.done-today .draft{color:var(--ok)}
.plan-h{font-size:13px;font-weight:700;margin-bottom:10px;text-align:center;color:#fff}
.plv{font-size:13px!important;font-weight:600;color:var(--muted)}
.ptrack{position:relative;overflow:visible}
.ptrack i{border-radius:9px}
.ptrack u{position:absolute;top:-4px;width:14px;height:16px;border-radius:4px;background:var(--orange);border:2px solid #fff;box-shadow:0 1px 3px rgba(15,23,32,.3)}
.plegend{display:flex;justify-content:center;gap:16px;font-size:12px;color:var(--muted);margin:2px 0 6px}
.plegend span{display:flex;align-items:center;gap:6px}
.plegend i{width:16px;height:6px;border-radius:9px;background:var(--navy)}
.plegend u{width:10px;height:12px;border-radius:3px;background:var(--orange)}
.crrow{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px dashed var(--line)}
.crl{flex:0 0 34%;font-size:14px;font-weight:600;text-align:left}
.mini5{flex:1;gap:4px}
.mini5 button{min-height:40px;padding:6px 0;border-radius:10px}
.mini5 button span{font-size:18px}
.sheet .pgroup{margin-top:12px}

/* ===== Coach briefing ===== */
.briefsw{margin-bottom:12px}
.briefs{display:grid;gap:12px}
.brief{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-left:5px solid #2BB673;border-radius:var(--radius);padding:16px;transition:transform 160ms var(--ease-out)}
button.brief:active{transform:scale(.98)}
.brief.amber{border-left-color:#F2B531}
.brief.red{border-left-color:#D9381E;background:#FFF8F6}
.brief.grey{border-left-color:var(--line)}
.br-top{display:flex;align-items:center;gap:8px}
.br-top b{font-size:17px}
.br-dot{width:10px;height:10px;border-radius:50%;background:#2BB673;flex:none}
.amber .br-dot{background:#F2B531} .red .br-dot{background:#D9381E;box-shadow:0 0 0 4px rgba(217,56,30,.15)} .grey .br-dot{background:var(--line)}
.br-tag{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:#E8F6F0;color:#1F7A52}
.amber .br-tag{background:#FFF4D6;color:#8A5A00} .red .br-tag{background:#FDE3DC;color:#B02A12} .grey .br-tag{background:var(--bg);color:var(--muted)}
.br-top small{margin-left:auto;font-size:12px;color:var(--muted)}
.br-head{font-size:16px;font-weight:700;line-height:1.35;margin-top:10px}
.br-text{font-size:14.5px;line-height:1.55;color:#3A4657;margin-top:6px}
.br-flags{list-style:none;margin-top:10px;display:grid;gap:6px}
.br-flags li{font-size:14px;line-height:1.45;padding:8px 10px;border-radius:10px;background:#FFF4D6}
.br-flags li.red{background:#FDE3DC;font-weight:600}
.br-flags li::before{content:"⚠️ ";}
.br-flags li.red::before{content:"🔴 ";}
.br-act{display:flex;gap:8px;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-size:14px;font-weight:600;line-height:1.45;color:var(--navy)}

/* ===== PDF export ===== */
.pdfopt{margin:14px 0 4px}
.po-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:8px}

.pdfopt .choices button{display:flex;flex-direction:column;gap:3px;text-align:left}
.pdfopt .choices small{font-size:12.5px;font-weight:500;color:var(--muted);line-height:1.4}
.pdfnote{min-height:80px}
.tick{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:10px;font-size:14px;font-weight:600}
.tick input{width:20px;height:20px;accent-color:var(--orange);-webkit-appearance:auto;appearance:auto}

/* ===== Danger zone ===== */
.danger{margin-top:40px;border:1.5px solid #F2C4B3;background:#FFF7F4;border-radius:var(--radius);padding:18px;text-align:center}
.danger h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#B8431A;font-weight:700}
.danger p{font-size:13px;color:var(--muted);line-height:1.5;margin:6px auto 12px;max-width:38ch}
.danger .dz{width:100%;max-width:240px;height:52px;display:block;margin:0 auto 10px;border:1.5px solid #F2C4B3;border-radius:14px;text-align:center;font-size:18px;font-weight:700;letter-spacing:.2em;background:#fff}
.danger .dz:focus{border-color:#B8431A}
.danger .dz::placeholder{letter-spacing:.05em;font-weight:500;font-size:15px}
.dzbtn{background:#B8431A;color:#fff;max-width:280px}

/* ===== Top widgets ===== */
.widgets{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.wg{border-radius:var(--radius);padding:14px;min-height:150px;display:flex;flex-direction:column;text-align:left;width:100%;position:relative;overflow:hidden;transition:transform 160ms var(--ease-out)}
button.wg:active{transform:scale(.97)}
.wg-card{color:var(--navy);background:linear-gradient(155deg,#F4E2A1 0%,#D8B65A 45%,#B8913A 100%);box-shadow:0 8px 20px rgba(15,23,32,.14);clip-path:polygon(0 0,100% 0,100% 88%,50% 100%,0 88%);padding-bottom:22px;align-items:center;text-align:center}
.wg-card.silver{background:linear-gradient(155deg,#F1F3F6 0%,#C9CED6 50%,#9DA5B1 100%)}
.wg-card.bronze{background:linear-gradient(155deg,#F0CDA8 0%,#C98F5B 50%,#9C6537 100%)}
.wg-card.special{background:radial-gradient(120% 80% at 80% 0%,#1D3A66 0%,#12294A 45%,#0B1B33 100%);color:#fff}
.wg-card.special .mc-top b{color:var(--orange)}
.wg-card::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.4) 45%,transparent 60%);transform:translateX(-130%);animation:shine 1.6s 500ms var(--ease-out) both;pointer-events:none}
.mc-top{display:flex;align-items:center;justify-content:center;gap:10px;width:100%}
.mc-top b{font-size:44px;font-weight:700;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.mc-top img{height:30px;width:auto;opacity:.85}
.mc-ovr{font-size:10.5px;font-weight:700;letter-spacing:.14em;margin-top:4px;opacity:.8}
.mc-name{font-size:15px;font-weight:700;letter-spacing:.08em;margin-top:8px;padding-top:6px;border-top:1px solid rgba(18,41,74,.2);width:100%}
.wg-card.special .mc-name{border-color:rgba(255,255,255,.2)}
.mc-g{font-size:12px;font-weight:700;margin-top:4px;opacity:.85}
.wg-card.empty{background:var(--card);border:2px dashed var(--line);box-shadow:none;clip-path:none;justify-content:center}
.wg-card.empty::after{display:none}
.mc-q{font-size:40px;font-weight:700;color:var(--line);line-height:1}
.mc-t{font-size:14px;font-weight:700;margin-top:6px}
.mc-s{font-size:13px;font-weight:700;color:var(--orange);margin-top:4px}
.wg-week{background:var(--navy);color:#fff}
.ww-h{font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--orange);text-align:center}
.weekdots.light{gap:6px;margin:12px 0 8px}
.weekdots.light .wd i{width:12px;height:12px}
.ww-n{text-align:center;font-size:13px;color:rgba(255,255,255,.7)}
.ww-n b{font-size:22px;color:#fff;margin-right:2px}
.ww-s{margin-top:auto;padding-top:8px;text-align:center;font-size:12px;font-weight:700;color:rgba(255,255,255,.75)}
.ww-s.ok{color:#7FD8AE}
.ww-s.go{color:var(--orange);width:100%;min-height:32px}
.hero{padding:22px 24px}
.hero h2{margin-bottom:4px}
.sheet .fut-wrap{margin-top:6px}
@media (max-width:360px){ .mc-top b{font-size:36px} .mc-top img{height:24px} .weekdots.light{gap:4px} .weekdots.light .wd i{width:10px;height:10px} }

/* ===== 1-99 rating ===== */
.r99{text-align:center;margin-bottom:10px}
.r99-n{font-size:46px;font-weight:700;color:var(--orange);line-height:1;font-variant-numeric:tabular-nums}
.r99-l{font-size:14px;font-weight:600;color:var(--navy);margin-top:4px;min-height:1.3em}
.pl small.plv{font-size:12px!important;color:var(--muted);font-weight:500;margin-right:6px}

/* ===== Player card (FIFA style) ===== */
.fut-wrap{display:flex;flex-direction:column;align-items:center;margin-bottom:14px}
.fut{position:relative;width:min(300px,82vw);aspect-ratio:3/3.8;padding:20px 22px 16px;color:var(--navy);overflow:hidden;
  clip-path:polygon(50% 0,100% 6%,100% 88%,50% 100%,0 88%,0 6%);
  background:linear-gradient(155deg,#F4E2A1 0%,#D8B65A 45%,#B8913A 100%);box-shadow:0 18px 40px rgba(15,23,32,.25);
  animation:cardIn 600ms var(--ease-out) both}
.fut.silver{background:linear-gradient(155deg,#F1F3F6 0%,#C9CED6 50%,#9DA5B1 100%)}
.fut.bronze{background:linear-gradient(155deg,#F0CDA8 0%,#C98F5B 50%,#9C6537 100%)}
.fut.special{background:radial-gradient(120% 80% at 80% 0%,#1D3A66 0%,#12294A 45%,#0B1B33 100%);color:#fff}
.fut.special .fut-ovr b,.fut.special .fs b{color:var(--orange)}
.fut-shine{position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.45) 45%,transparent 60%);transform:translateX(-120%);animation:shine 1.6s 400ms var(--ease-out) both;pointer-events:none}
.fut-top{display:flex;justify-content:space-between;align-items:flex-start;margin-top:10px}
.fut-ovr{display:flex;flex-direction:column;align-items:center;line-height:1}
.fut-ovr b{font-size:54px;font-weight:700;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.fut-ovr span{font-size:12px;font-weight:700;letter-spacing:.16em;margin-top:2px}
.fut-ovr i{font-style:normal;font-size:11px;font-weight:700;margin-top:6px;padding:3px 8px;border-radius:999px;background:rgba(18,41,74,.12)}
.fut.special .fut-ovr i{background:rgba(255,255,255,.12)}
.fut-logo{height:46px;width:auto;opacity:.85}
.fut-name{font-size:22px;font-weight:700;letter-spacing:.06em;text-align:center;margin-top:14px;padding-top:10px;border-top:1px solid currentColor;border-color:rgba(18,41,74,.2)}
.fut.special .fut-name{border-color:rgba(255,255,255,.2)}
.fut-tier{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;text-align:center;opacity:.65;margin-top:2px}
.fut-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;margin:14px 6px 0}
.fs{display:flex;align-items:baseline;gap:7px}
.fs b{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;min-width:30px}
.fs span{font-size:13px;font-weight:700;letter-spacing:.06em;opacity:.8}
.fs em{font-style:normal;font-size:10px;font-weight:700;color:var(--ok)}
.fs em.down{color:#B8431A}
.fut-meta{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:14px}
.fut-meta span{font-size:12px;font-weight:700;padding:5px 11px;border-radius:999px;background:var(--card);border:1px solid var(--line)}
.fut-meta span.up{background:#E8F6F0;color:var(--ok);border-color:transparent}
.fut-meta span.down{background:var(--orange-soft);color:var(--orange);border-color:transparent}
@keyframes cardIn{from{opacity:0;transform:translateY(14px) scale(.96) rotateX(8deg)}to{opacity:1;transform:none}}
@keyframes shine{to{transform:translateX(120%)}}
.crrow input[type=range]{flex:1;height:30px}
.crl small{display:block;font-size:11px;color:var(--muted);font-weight:500}
.crv{width:30px;text-align:right;font-variant-numeric:tabular-nums;color:var(--orange)}
.potbox{margin-top:16px;text-align:center;background:var(--bg);border-radius:14px;padding:14px}
.potbox label{font-weight:700;font-size:15px}
.potbox p{font-size:13px;color:var(--muted);margin:2px auto 10px}
.potbox .pinfield{letter-spacing:.1em;max-width:160px;margin:0 auto}

/* ===== 5-point labelled scales ===== */
.s5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.s5 button{border:1.5px solid var(--line);border-radius:14px;padding:10px 2px 8px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;font-weight:600;line-height:1.15;min-height:76px;text-align:center;transition:transform 160ms var(--ease-out),background-color 160ms ease,border-color 160ms ease}
.s5 button span{font-size:24px;line-height:1}
.s5 button:active{transform:scale(.94)}
.s5 button.on{border-color:var(--orange);background:var(--orange-soft)}
@media (max-width:360px){ .s5 button{font-size:10.5px} .s5 button span{font-size:21px} }
.deepbtn{margin-bottom:10px;flex-direction:column;gap:0;height:auto;padding:10px 20px;min-height:56px}
.deepbtn span{font-size:12px;font-weight:600;opacity:.7}
.deeplink{display:block;margin:8px auto 0;color:var(--navy)}
.calm{background:var(--navy);color:#fff;border-radius:14px;padding:14px 16px;font-size:15px;line-height:1.5;margin-top:14px;text-align:center;animation:rise 260ms var(--ease-out)}
.done .words.soft{background:var(--orange-soft);color:var(--ink);margin-top:12px}
.done .words .w.small{font-size:16px;font-weight:600}

/* ===== Inline notes, empty stats, profile groups ===== */
.notebox{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;text-align:center}
.notebox textarea{min-height:64px;animation:fade 200ms var(--ease-out)}
.addnote{font-size:14px;font-weight:600;color:var(--navy);padding:8px 14px;border-radius:999px;min-height:40px;transition:transform 160ms var(--ease-out),background-color 160ms ease}
.addnote span{color:var(--muted);font-weight:500}
.addnote:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){ .addnote:hover{background:var(--bg)} }
.stat .v.none{font-size:13px;font-weight:600;color:#9AA3B2;margin:8px 0 10px}
.pgroup{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700;margin:16px 0 2px;text-align:center}
.pgroup:first-of-type{margin-top:6px}

/* ===== Coach replies ===== */
.coachsays{background:var(--orange-soft);border-radius:14px;padding:12px 14px;margin:10px 0 4px}
.cs-h{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--orange)}
.cs-h img{height:16px;width:auto}
.cs-r{margin-left:auto;font-size:20px;letter-spacing:0}
.coachsays p{font-size:15px;line-height:1.45;margin-top:6px;overflow-wrap:anywhere}
.coachsays small{display:block;font-size:11px;color:var(--muted);margin-top:4px}
.replybox{margin-top:14px;border-top:1px solid var(--line);padding-top:14px}
.rb-t{font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:700;color:var(--muted);text-align:center;margin-bottom:10px}
.reacts{display:flex;justify-content:center;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.reacts button{width:46px;height:46px;border-radius:50%;font-size:22px;border:1.5px solid var(--line);transition:transform 160ms var(--ease-out),border-color 160ms ease,background-color 160ms ease}
.reacts button:active{transform:scale(.9)}
.reacts button.on{border-color:var(--orange);background:var(--orange-soft);transform:scale(1.06)}
.replytxt{min-height:64px;margin-bottom:10px}
.btn-sm{height:46px;font-size:15px}
.rdot{width:9px;height:9px;border-radius:50%;background:var(--orange);margin-left:auto;flex:none}
.rmark{margin-left:auto;font-size:18px;flex:none}
.hist summary:has(.rdot):after,.hist summary:has(.rmark):after{margin-left:8px}
.fcs{display:grid;gap:10px}
.fromcoach{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;position:relative}
.fromcoach.new{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange-soft)}
.fromcoach.new:after{content:"New";position:absolute;top:-9px;right:14px;background:var(--orange);color:#fff;font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:3px 8px;border-radius:999px}
.fc-r{font-size:28px;line-height:1}
.fc-b p{font-size:15px;font-weight:600;line-height:1.45;overflow-wrap:anywhere}
.fc-b small{display:block;font-size:12px;color:var(--muted);margin-top:4px}

/* ===== You in numbers ===== */
.insights{display:grid;gap:10px}
.ins{display:flex;gap:14px;align-items:flex-start;background:var(--navy);color:#fff;border-radius:var(--radius);padding:16px 16px 16px 14px}
.ins-i{font-size:26px;line-height:1;width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.08);display:grid;place-items:center;flex:none}
.ins h4{font-size:16px;font-weight:700;color:#fff}
.ins p{font-size:14px;line-height:1.5;color:rgba(255,255,255,.8);margin-top:3px}
.lock{color:var(--ink);font-size:15px;display:block;margin-bottom:4px}
.unlock{height:8px;border-radius:9px;background:var(--line);overflow:hidden;margin:14px auto 6px;max-width:260px}
.unlock i{display:block;height:100%;width:100%;background:var(--orange);transform-origin:left;border-radius:9px}
.empty small{font-size:12px}

/* ===== Scouting file ===== */
.scouts{display:grid;gap:8px}
.scout{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 14px;text-align:left;width:100%;min-height:64px;transition:transform 160ms var(--ease-out),border-color 160ms ease}
.scout:active{transform:scale(.98)}
.sc-av{width:40px;height:40px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:none}
.sc-b h4{font-size:16px;font-weight:700}
.sc-b p{font-size:13px;color:var(--muted)}
.scout .arr{margin-left:auto;color:var(--orange);font-size:22px;font-weight:700}
.scoutd{display:grid;gap:10px;margin-top:16px}
.sd{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;text-align:left}
.sd h4{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700;margin-bottom:8px;text-align:center}
.sd p{font-size:15px;line-height:1.5;padding:4px 0;overflow-wrap:anywhere}
.chips.static span{padding:8px 13px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-size:14px;font-weight:600}
.sm{display:flex;align-items:center;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line)}
.sm:last-child{border-bottom:0}
.sm b{display:block;font-size:15px}
.sm small{font-size:12px;color:var(--muted)}
.hint-card{margin-top:12px;background:var(--navy);color:#fff;border-radius:14px;padding:14px;text-align:left;animation:rise 260ms var(--ease-out)}
.hc-h{font-weight:700;font-size:14px;margin-bottom:6px}
.hint-card p{font-size:14px;line-height:1.45;color:rgba(255,255,255,.85);margin-top:4px}
.hint-card b{color:var(--orange)}
.hint-card .link{color:#fff;text-decoration:underline;font-size:14px;padding:6px 0 0;min-height:0}
.sheet.tall{max-height:86vh;display:flex;flex-direction:column}
.sheet .btn{flex:none}
.sheet-scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;margin:0 -22px;padding:0 22px 12px}
.sheet-scroll .scoutd{margin-top:8px}

/* ===== Top bar actions ===== */
.topacts{display:flex;align-items:center;gap:6px}
.iconbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-size:18px;color:var(--muted);transition:transform 160ms var(--ease-out),background-color 160ms ease}
.iconbtn:active{transform:scale(.92)}
.iconbtn.spin{animation:spin 700ms linear infinite}
.backlink{font-size:16px;font-weight:700;color:var(--navy);min-height:44px;padding:0 4px;transition:transform 160ms var(--ease-out)}
.backlink:active{transform:scale(.97)}
@media (hover:hover) and (pointer:fine){ .iconbtn:hover{background:var(--line)} }

/* ===== Coach access on login ===== */
.coachlink{margin:22px auto 0;font-size:14px;font-weight:600;color:rgba(255,255,255,.6);padding:10px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.18);min-height:44px;transition:transform 160ms var(--ease-out),background-color 160ms ease,color 160ms ease}
.coachlink:active{transform:scale(.97)}
.coachlink.sel{background:#fff;color:var(--navy);border-color:#fff}

/* ===== Coach view ===== */
.pcard{align-items:center}
.pcard .avatar{width:50px;height:50px}
.pcard .pc{min-width:0}
.minis{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mini{font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--bg);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.mini.warn{background:var(--orange-soft);border-color:transparent;color:var(--orange)}
.stats{grid-template-columns:repeat(3,minmax(0,1fr))}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:12px;align-items:flex-start;background:var(--card);border:1px solid var(--line);border-left:3px solid var(--orange);border-radius:14px;padding:12px 14px}
.alert .ai{font-size:20px;line-height:1.2}
.alert .at{font-size:15px;font-weight:600;line-height:1.4;overflow-wrap:anywhere}
.alert .aw{font-size:12px;color:var(--muted);margin-top:2px}
.hint{font-size:12px;font-weight:500;color:var(--muted);letter-spacing:0;text-transform:none}
.sumtxt{min-width:0}
.hist .when b{color:var(--ink)}
.skel{height:180px;border-radius:24px;margin-top:6px;background:linear-gradient(90deg,var(--line) 0%,#EEF0F3 50%,var(--line) 100%);background-size:200% 100%;animation:shimmer 1.2s linear infinite}
.skel.s2{height:96px;border-radius:var(--radius);margin-top:12px}
.link.armed{color:var(--orange)}

/* ===== Bottom sheet (change PIN) ===== */
.sheetwrap{position:fixed;inset:0;z-index:40}
.sheet-bg{position:absolute;inset:0;background:rgba(11,27,51,.45);opacity:0;transition:opacity 200ms ease}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:520px;background:var(--card);border-radius:24px 24px 0 0;padding:10px 22px calc(18px + var(--sab));text-align:center;transform:translateY(100%);transition:transform 200ms var(--ease-out);box-shadow:0 -8px 32px rgba(15,23,32,.18)}
.sheetwrap.open .sheet-bg{opacity:1}
.sheetwrap.open .sheet{transform:translateY(0);transition:transform 420ms cubic-bezier(0.32,0.72,0,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 16px}
.sheet h3{font-size:22px;font-weight:700;letter-spacing:-.01em}
.sheet p{color:var(--muted);font-size:15px;line-height:1.5;margin:6px auto 16px;max-width:34ch}
.pinfield{width:100%;height:56px;border:1.5px solid var(--line);border-radius:14px;text-align:center;font-size:22px;letter-spacing:.4em;font-weight:700;margin-bottom:10px;background:#fff;transition:border-color 160ms ease}
.pinfield::placeholder{font-size:15px;letter-spacing:0;font-weight:500}
.pinfield:focus{border-color:var(--orange)}
.sheet .btn{margin-top:6px}
.sheetcancel{display:block;margin:6px auto 0}
@media (min-width:720px){ .sheet{bottom:50%;border-radius:24px;padding-bottom:22px;transform:translateY(54%) scale(.97);opacity:0;transition:transform 160ms var(--ease-out),opacity 150ms ease} .sheet .grab{display:none} .sheetwrap.open .sheet{transform:translateY(50%) scale(1);opacity:1;transition:transform 240ms var(--ease-out),opacity 200ms ease} }

@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shimmer{from{background-position:200% 0}to{background-position:-200% 0}}

/* Desktop / larger screens */
@media (min-width:720px){
  body{background:var(--bg)}
  .login .wrap{justify-content:center;max-width:480px}
  .login h1{margin-top:28px}
  .motto{margin-top:40px}
  .action{padding:20px}
  .wz-foot{padding-bottom:28px}
}

/* Reduced motion: keep fades that help comprehension, remove movement */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
  .toast,.toast.show{transition:opacity 150ms ease!important}
}
</style>

/* Game profile: a 1-99 rating (FIFA style) that also shows the level in words */
const LEVELS = {
  shot: [['🌱','Still learning'],['🎯','OK in practice'],['🔁','Solid in rallies'],['🏆','Works in matches'],['🦁','My weapon']],
  mind: [['🌱','Hardly ever'],['🎯','Sometimes'],['🔁','Often'],['🏆','Most of the time'],['🦁','Even under pressure']],
};
const lvlIdx = v => Math.max(0, Math.min(4, Math.floor((v - 1) / 20)));
const lvl = (name, v) => { const l = LEVELS[name][lvlIdx(v)]; return `${l[0]} ${l[1]}`; };
const r99 = (id, label, levels, extra = {}) => ({ id, type:'rate99', label, levels, ...extra });
const s5 = (id, label, scale, extra = {}) => ({ id, type:'scale5', label, scale:SC[scale], ...extra });

            form:null, step:0, data:{}, ctx:{},
            squad:null, cPlayer:null, cFilter:'all' };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const kEntries = () => 'ata_entries_' + S.user.id;
const kDraft = f => 'ata_draft_' + S.user.id + '_' + f;
const getEntries = () => store.get(kEntries(), []);
const setEntries = e => store.set(kEntries(), e);
/* Calendar day in Spain: a daily check-in can be edited until midnight, then it locks */
const madridDay = d => new Date(d).toLocaleDateString('en-CA', { timeZone:'Europe/Madrid' });
const todayDaily = () => getEntries().find(e => e.type === 'daily' && madridDay(e.date) === madridDay(new Date()));
const playerName = id => (PLAYERS.find(p => p.id === id) || { name: id }).name;

const LOCALE = 'en-GB';
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => n.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString(LOCALE,{weekday:'short',day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString(LOCALE,{hour:'2-digit',minute:'2-digit'}); };
function ago(iso){
  const m = Math.round((Date.now() - new Date(iso)) / 60000);
  if (m < 1) return 'just now'; if (m < 60) return m + ' min ago';
  const h = Math.round(m / 60); if (h < 24) return h + 'h ago';
  const d = Math.round(h / 24); return d === 1 ? 'yesterday' : d + ' days ago';
}

async function api(path, { method = 'GET', body, pin, player } = {}){
  const headers = { 'Content-Type': 'application/json' };
  if (pin) headers['x-pin'] = pin;
  if (player) headers['x-player'] = player;
  const r = await fetch(API + path, { method, headers, body: body ? JSON.stringify(body) : undefined, cache: 'no-store' });
  let j = null; try { j = await r.json(); } catch(e) {}
  if (!r.ok) { const err = new Error((j && j.error) || ('HTTP ' + r.status)); err.status = r.status; throw err; }
  return j;
}

function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}

function selectPlayer(id){
  S.selected = id;
  document.querySelectorAll('.player').forEach(b => b.classList.toggle('sel', b.dataset.val === id));
  document.querySelector('.coachlink').classList.toggle('sel', id === 'coach');

  const box = document.querySelector('.pinbox');

async function doLogin(){
  const el = document.getElementById('pin');
  const id = S.selected, pin = el.value.trim();
  if (!id || S.busy) return;
  if (pin.length !== 4) { toast('Enter your 4-digit PIN'); return; }
  S.busy = true; el.readOnly = true;
  const btn = $app.querySelector('[data-act=login]'); btn.textContent = 'Checking…';
  try {
    const coach = id === 'coach';
    await api('/login', { method:'POST', body:{ role: coach ? 'coach' : 'player', player: coach ? undefined : id, pin } });
    el.blur();
    if (coach) { S.coach = true; S.coachPin = pin; store.set('ata_session', { coach:true, pin }); renderCoach(true); }
    else { S.user = PLAYERS.find(p => p.id === id); S.pin = pin; S.challenge = store.get('ata_challenge_' + id, null); store.set('ata_session', { player:id, pin });
           introDue() ? renderIntro() : renderHome(true); syncEntries(); retryPending(); }
  } catch(e) {
    el.readOnly = false; el.value = ''; btn.textContent = 'Sign in';
    if (e.status === 401) { toast('Wrong PIN'); el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); }
    else if (e.status === 429) toast('Too many attempts. Try again in 15 minutes.');
    else toast('No connection. Check your internet and try again.');
    focusPin();
  } finally { S.busy = false; }
}

function logout(){
  store.del('ata_session');
  Object.assign(S, { user:null, pin:null, coach:false, coachPin:null, selected:null, squad:null, cPlayer:null, form:null });
  renderLogin();
}

/* ===================== Shared bits ===================== */
function spark(vals){
  if (vals.length < 2) return '<svg viewBox="0 0 100 28"></svg>';
  const pts = vals.map((v,i) => `${(i/(vals.length-1))*96+2},${26-((v-1)/4)*24}`).join(' ');
  return `<svg viewBox="0 0 100 28" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--orange)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function series(entries, type, key){
  return entries.filter(e => e.type===type && typeof e.data[key]==='number').slice(0,10).reverse().map(e => e.data[key]);
}
function statCard(label, E, type, key){
  const s = series(E, type, key);
  if (!s.length) return `<div class="stat empty-stat"><div class="k">${label}</div><div class="v none">No data yet</div></div>`;
  return `<div class="stat"><div class="k">${label}</div><div class="v">${s[s.length-1]}<small>/5</small></div>${spark(s)}</div>`;
}
function streak(entries){
  const days = new Set(entries.map(e => new Date(e.date).toDateString()));
  const d = new Date(); if (!days.has(d.toDateString())) d.setDate(d.getDate()-1);
  let n = 0; while (days.has(d.toDateString())) { n++; d.setDate(d.getDate()-1); }
  return n;
}
function greeting(){ const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 19 ? 'Good afternoon' : 'Good evening'; }

function histItem(e, who, coachPid){
  const F = FORMS[e.type]; if (!F) return '';
  const cls = e.type==='post' ? (e.data.result==='Won' ? 'g' : 'n') : e.type==='pre' ? 'n' : '';
  let body = '';
  F.steps.forEach(st => {
    const rows = expand(st.fields).filter(f => f.type!=='info' && (!f.showIf || f.showIf(e.data))).map(f => {
      const v = fmtVal(f, e.data[f.id]); return v ? `<div class="row"><span class="l">${esc(f.label)}</span>${esc(v)}</div>` : '';
    }).join('');
    if (rows) body += `<h4>${esc(st.title)}</h4>${rows}`;
  });
  const pending = e.sent === false ? ' · ⏳' : '';
  const mark = coachPid ? (e.reply ? `<span class="rmark" title="Replied">${e.reply.reaction || '💬'}</span>` : (['post','weekly'].includes(e.type) && Date.now() - new Date(e.date) < 14*864e5 ? '<span class="rdot" title="Waiting for your comment"></span>' : ''))
                        : (e.reply ? `<span class="rmark">${e.reply.reaction || '💬'}</span>` : '');
  return `<details class="hist"><summary><span class="tag ${cls}">${F.tag}</span><div class="sumtxt"><div class="when">${who?`<b>${esc(who)}</b> · `:''}${fmtDate(e.date)}${e.editedAt ? ' · edited' : ''}${pending}</div><div class="ind">${esc(F.indicator(e.data))}</div></div>${mark}</summary><div class="detail">${replyView(e.reply)}${body}${coachPid ? replyForm(e, coachPid) : ''}</div></details>`;
}

const CATS = [

  ['BH',  ['bh']],
  ['NET', ['fv','bv','overhead']],
  ['TCH', ['slice','drop']],
  ['PHY', ['speed','endurance']],
  ['MEN', ['m_confidence','m_focus','m_fight','m_pressure','m_mistakes']],

function cardStats(d){
  const stats = {};
  CATS.forEach(([k, keys]) => { const v = keys.map(x => d[x]).filter(n => typeof n === 'number');
    stats[k] = v.length ? Math.round(avg(v)) : null; });
  const vals = Object.values(stats).filter(v => v != null);
  return { stats, ovr: vals.length ? Math.round(avg(vals)) : 0 };
}

      <div class="fut-shine"></div>

        <div class="fut-ovr"><b>${cur.ovr}</b><span>OVR</span>${pot ? `<i>POT ${pot}</i>` : ''}</div>

/* History grouped by week: everything is kept by day and by week */
function weekStart(d){ const x = new Date(d); x.setHours(0,0,0,0); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x; }
function weekLabel(ws){
  const diff = Math.round((weekStart(new Date()) - ws) / (7*864e5));
  if (diff === 0) return 'This week'; if (diff === 1) return 'Last week';
  const end = new Date(ws); end.setDate(end.getDate() + 6);
  const f = d => d.toLocaleDateString(LOCALE,{ day:'numeric', month:'short' });
  return `${f(ws)} – ${f(end)}`;
}
function historyHTML(list, whoFn, pidFn){
  list = list.filter(e => FORMS[e.type]);
  const groups = new Map();
  list.forEach(e => { const k = weekStart(e.date).getTime(); if (!groups.has(k)) groups.set(k, []); groups.get(k).push(e); });
  return [...groups.entries()].map(([k, items]) =>
    `<div class="wk"><span>${weekLabel(new Date(k))}</span><small>${items.length} ${items.length===1?'entry':'entries'}</small></div>` +
    items.map(e => histItem(e, whoFn ? whoFn(e) : undefined, pidFn ? pidFn(e) : undefined)).join('')
  ).join('');
}

/* ===================== You in numbers ===================== */
const avg = a => a.reduce((x,y) => x + y, 0) / a.length;
const r1 = n => (Math.round(n * 10) / 10).toString();
const isWin = e => e.data.result === 'Won';
function insights(E){
  /* Coach-only. Small samples + positive bias = noisy, so it needs a minimum of data,
     compares only things the player controls, and phrases everything as process. */
  const out = [];
  const byId = Object.fromEntries(E.map(e => [e.id, e]));
  const posts = E.filter(e => e.type === 'post');
  const funOf = p => typeof p.data.enjoy_match === 'number' ? p.data.enjoy_match : null;
  const both = (a, b) => a.length >= 2 && b.length >= 2 ? [avg(a), avg(b)] : null;
  const gap = 0.6; // on a 5-point scale

  // Routine → enjoyment and wins
  const rY = posts.filter(p => p.data.routine === 'Almost always'), rN = posts.filter(p => ['Sometimes','Almost never'].includes(p.data.routine));
  const cr = both(rY.map(funOf).filter(x => x != null), rN.map(funOf).filter(x => x != null));
  if (cr && cr[0] - cr[1] >= gap) out.push({ icon:'🔁', t:'Routine and enjoyment', x:`Matches with the routine almost always: fun ${r1(cr[0])}/5. Without it: ${r1(cr[1])}/5. Good thing to point out to them.`, s:cr[0]-cr[1] });
  if (rY.length >= 2 && rN.length >= 2) { const a = rY.filter(isWin).length, b = rN.filter(isWin).length;
    if (a/rY.length - b/rN.length >= 0.25) out.push({ icon:'🔁', t:'Routine and results', x:`With the routine: won ${a} of ${rY.length}. Without it: ${b} of ${rN.length}. Small sample: use it as a conversation, not a verdict.`, s:1.5 }); }

  // Process goal kept → enjoyment
  const pY = posts.filter(p => p.data.process_ok === 'Yes'), pN = posts.filter(p => ['Halfway','No'].includes(p.data.process_ok));
  const cp = both(pY.map(funOf).filter(x => x != null), pN.map(funOf).filter(x => x != null));
  if (cp && cp[0] - cp[1] >= gap) out.push({ icon:'🎯', t:'Goal kept, more fun', x:`When they kept their process goal they enjoyed competing ${r1(cp[0])}/5, against ${r1(cp[1])}/5.`, s:cp[0]-cp[1] });

  // Self-talk after mistakes
  const kind = p => ['“Come on!”','My key word'].includes(p.data.self_talk) ? 'pos' : p.data.self_talk === 'Something mean about myself' ? 'neg' : null;
  const neg = posts.filter(p => kind(p) === 'neg').length, tot = posts.filter(p => kind(p)).length;
  if (tot >= 3 && neg / tot >= 0.4) out.push({ icon:'🗣️', t:'Inner voice is harsh', x:`In ${neg} of ${tot} matches they said something mean to themselves after mistakes. Worth training their key word on court.`, s:2.5 });
  else if (tot >= 3 && neg === 0) out.push({ icon:'🗣️', t:'Inner voice is on their side', x:`No harsh self-talk in their last ${tot} matches. Tell them you noticed.`, s:1 });

  // Sleep before matches → enjoyment
  const sleepFor = p => { const t = new Date(p.date);
    const d = E.find(e => e.type==='daily' && e.data.sleep_hours && new Date(e.date) <= t && t - new Date(e.date) < 36*36e5);
    return d && d.data.sleep_hours; };
  const sG = [], sB = [];
  posts.forEach(p => { const sl = sleepFor(p), f = funOf(p); if (sl && f != null) (['8–9','Over 9'].includes(sl) ? sG : sB).push(f); });
  const cs = both(sG, sB);
  if (cs && cs[0] - cs[1] >= gap) out.push({ icon:'😴', t:'Sleep before matches', x:`After 8+ hours they enjoyed competing ${r1(cs[0])}/5; after less, ${r1(cs[1])}/5.`, s:cs[0]-cs[1] });

  // Warm-up
  const wr = posts.map(p => { const pre = p.pre && byId[p.pre]; const f = funOf(p); return pre && pre.data.warmup && f != null ? { w:pre.data.warmup.startsWith('Yes'), f } : null; }).filter(Boolean);
  const cw = both(wr.filter(x => x.w).map(x => x.f), wr.filter(x => !x.w).map(x => x.f));
  if (cw && cw[0] - cw[1] >= gap) out.push({ icon:'🔥', t:'Warm-up pays', x:`Properly warmed up: ${r1(cw[0])}/5 fun. Not really: ${r1(cw[1])}/5.`, s:cw[0]-cw[1] });

  // Nerves read as fear, repeatedly
  const pres = E.filter(e => e.type==='pre').slice(0, 6);
  const fear = pres.filter(e => (e.data.reading||'').includes('Scared')).length;
  if (pres.length >= 3 && fear >= 2) out.push({ icon:'🦋', t:'Nerves read as fear', x:`In ${fear} of their last ${pres.length} pre-matches they read their nerves as fear of losing. Talk about what the nerves are for.`, s:2.2 });

  // Go-to shot
  if (posts.length >= 3) { const c = {}; posts.forEach(p => (p.data.worked || []).forEach(x => c[x] = (c[x] || 0) + 1));
    const top = Object.entries(c).sort((a,b) => b[1]-a[1])[0];
    if (top && top[1] >= 2) out.push({ icon:'🎯', t:'Go-to shot', x:`${top[0]} worked in ${top[1]} of ${posts.length} matches.`, s:1 + top[1]/posts.length }); }

  // Enjoyment trend (weekly)
  const wk = E.filter(e => e.type==='weekly' && typeof e.data.enjoy === 'number').slice(0, 4);
  if (wk.length >= 3 && wk[0].data.enjoy < wk[wk.length-1].data.enjoy - 1) out.push({ icon:'📉', t:'Enjoyment going down', x:`Weekly fun went from ${wk[wk.length-1].data.enjoy}/5 to ${wk[0].data.enjoy}/5. Ask them what changed.`, s:3 });

  // Profile vs coach
  const pr = E.filter(e => e.type==='profile'), cpf = E.filter(e => e.type==='coachprofile');
  if (pr.length && cpf.length) { const a = pr[0].data, b = cpf[0].data; const gaps = [];
    PROFILE_SHOTS.forEach(([k,l]) => { if (typeof a[k]==='number' && typeof b[k]==='number' && Math.abs(a[k]-b[k]) >= 15) gaps.push(`${l} (they ${a[k]}, you ${b[k]})`); });
    if (gaps.length) out.push({ icon:'⚖️', t:'Where you see it differently', x:gaps.slice(0,4).join(' · ') + '. Good topics for your next 1-to-1.', s:2 }); }

  return out.filter(Boolean).sort((a,b) => b.s - a.s);
}
function insightsHTML(E){
  const list = insights(E);
  const m = E.filter(e => e.type==='post').length;
  if (!list.length) return `<div class="empty"><b class="lock">🔒 Patterns appear with more data</b><br>At least 4 post-matches are needed before comparisons mean anything (${m}/4 so far).<div class="unlock"><i style="transform:scaleX(${Math.min(1, m/4)})"></i></div></div>`;
  return `<div class="insights">${list.slice(0, 6).map(i => `<div class="ins"><div class="ins-i">${i.icon}</div><div><h4>${esc(i.t)}</h4><p>${esc(i.x)}</p></div></div>`).join('')}</div>

}

/* ===================== Scouting file ===================== */
const dotted = n => String(n).trim().replace(/\.+$/,'') + '.';
const oppKey = n => String(n || '').trim().toLowerCase().replace(/\s+/g, ' ');
function scoutData(E){
  const map = new Map(), byId = Object.fromEntries(E.map(e => [e.id, e]));
  const add = (name, e) => { const k = oppKey(name); if (!k) return;
    if (!map.has(k)) map.set(k, { key:k, name:String(name).trim(), pre:[], post:[] });
    const o = map.get(k), arr = e.type === 'pre' ? o.pre : o.post; if (!arr.includes(e)) arr.push(e); };
  E.forEach(e => { if (e.type === 'pre' || e.type === 'post') add(e.data.opponent, e); });
  // a pre-match left blank gets filed under the opponent named in its post-match
  E.filter(e => e.type==='post' && e.pre && byId[e.pre] && !oppKey(byId[e.pre].data.opponent)).forEach(e => add(e.data.opponent, byId[e.pre]));
  return [...map.values()].map(o => {
    const all = [...o.pre, ...o.post].sort((a,b) => String(b.date).localeCompare(String(a.date)));
    return { ...o, all, last:all[0], won:o.post.filter(isWin).length, lost:o.post.filter(e => e.data.result==='Lost').length };
  }).sort((a,b) => String(b.last.date).localeCompare(String(a.last.date)));
}
function scoutListHTML(E, own){
  const S2 = scoutData(E);
  if (!S2.length) return `<div class="empty">${own ? 'Every opponent you play gets a file here: how they play, what worked, what you’d change. Next time you meet them, it’s ready.' : 'No opponents logged yet.'}</div>`;
  return `<div class="scouts">${S2.slice(0,20).map(o => `<button type="button" class="scout" data-act="scout" data-val="${esc(o.key)}">
      <div class="sc-av">${esc(initials(o.name))}</div>
      <div class="sc-b"><h4>${esc(o.name)}</h4><p>${o.post.length ? `${o.won}W ${o.lost}L` : 'Not played yet'} · last ${new Date(o.last.date).toLocaleDateString(LOCALE,{day:'numeric',month:'short'})}</p></div>
      <div class="arr">›</div></button>`).join('')}</div>`;
}
function scoutDetailHTML(o){

  return `<div class="scoutd">

/* ===================== Consistency without streaks ===================== */
/* Research: expected rewards for just taking part (streaks) lower intrinsic motivation,
   more in children. So: a week view that never "breaks", no counter to lose. */
function weekDots(E){
  const ws = weekStart(new Date());
  const days = new Set(E.map(e => new Date(e.date).toDateString()));
  const names = ['M','T','W','T','F','S','S'];
  const today = new Date().toDateString();
  const dots = names.map((n, i) => { const d = new Date(ws); d.setDate(d.getDate() + i);
    const ds = d.toDateString(); return `<span class="wd ${days.has(ds)?'on':''} ${ds===today?'today':''}"><i></i>${n}</span>`; }).join('');
  const n = E.filter(e => weekStart(e.date).getTime() === ws.getTime()).length;
  return { html:`<div class="weekdots">${dots}</div>`, n };
}

async function syncEntries(){

/* ===================== Step-by-step form ===================== */
function startForm(f){
  S.form = f; S.ctx = {}; S.openNotes = new Set();
  if (f === 'daily') {
    const today = todayDaily();
    if (today) { S.ctx.edit = today; S.data = { ...today.data }; S.step = 0; renderWizard('fwd'); return; }
  }
  const draft = store.get(kDraft(f), null);
  S.data = draft ? draft.data : {};
  S.step = draft ? Math.min(draft.step, FORMS[f].steps.filter(st => !st.deep || S.data._deep).length-1) : 0;
  if (f === 'profile' && !draft) {
    const last = getEntries().find(e => e.type === 'profile');
    if (last) S.data = { ...last.data };
  }
  if (f === 'post') {
    const E = getEntries();
    const used = new Set(E.filter(e => e.type==='post' && e.pre).map(e => e.pre));
    const pre = E.find(e => e.type==='pre' && !used.has(e.id) && (Date.now()-new Date(e.date)) < 4*864e5);
    if (pre) { S.ctx.pre = pre; if (!S.data.opponent) S.data.opponent = pre.data.opponent; if (!S.data.tournament) S.data.tournament = pre.data.tournament; }
  }
  renderWizard('fwd');
}

const visibleFields = st => st.fields.filter(f => !f.showIf || f.showIf(S.data));
/* A slider can carry an optional note: list it as its own field for history, email and validation */
const expand = fields => fields.flatMap(f => f.note ? [f, { id:f.note.id, type:'textarea', label:f.note.label, optional:true }] : [f]);

function noteHTML(f){
  const nv = S.data[f.note.id] || '';
  return `<div class="notebox">${nv || S.openNotes.has(f.note.id)
    ? `<textarea rows="2" data-id="${f.note.id}" autocapitalize="sentences" placeholder="${esc(f.note.ph||'Describe it in your own words')}" aria-label="${esc(f.note.label)}">${esc(nv)}</textarea>`

function fieldHTML(f){
  if (f.type === 'info') return f.render();
  const v = S.data[f.id];
  const opt = f.optional ? ' <span class="opt">(optional)</span>' : '';
  let inner = '';
  switch (f.type){
    case 'slider': {
      if (typeof v !== 'number') S.data[f.id] = f.def ?? 5;
      const val = S.data[f.id], p = ((val-f.min)/(f.max-f.min))*100;
      inner = `<div class="sl-val" id="sv-${f.id}">${val}<small>/${f.max}</small></div>
        <input type="range" min="${f.min}" max="${f.max}" step="1" value="${val}" data-id="${f.id}" style="--p:${p}%" aria-label="${esc(f.label)}">
        <div class="sl-ends"><span>${esc(f.left)}</span><span>${esc(f.right)}</span></div>`;
      if (f.note) inner += noteHTML(f);
      break; }
    case 'rate99': {
      if (typeof v !== 'number') S.data[f.id] = 50;
      const val = S.data[f.id];
      inner = `<div class="r99"><div class="r99-n" id="sv-${f.id}">${val}</div><div class="r99-l" id="lv-${f.id}">${lvl(f.levels, val)}</div></div>
        <input type="range" min="1" max="99" step="1" value="${val}" data-id="${f.id}" data-levels="${f.levels}" style="--p:${(val-1)/98*100}%" aria-label="${esc(f.label)}">`;
      if (f.note) inner += noteHTML(f);
      break; }
    case 'scale5': {
      inner = `<div class="s5" role="radiogroup" aria-label="${esc(f.label)}">${f.scale.map(([ic, lb], i) =>
        `<button type="button" role="radio" aria-checked="${v===i+1}" class="${v===i+1?'on':''}" data-act="pick5" data-id="${f.id}" data-val="${i+1}"><span>${ic}</span>${esc(lb)}</button>`).join('')}</div>`;
      if (f.note) inner += noteHTML(f);
      break; }
    case 'emoji':
      inner = `<div class="emo">${f.options.map(([e,l]) => { const val = e+' '+l;
        return `<button type="button" class="${v===val?'on':''}" data-act="pick" data-id="${f.id}" data-val="${esc(val)}"><span>${e}</span>${esc(l)}</button>`; }).join('')}</div>`;
      break;
    case 'choice':
      inner = `<div class="choices">${f.options.map(o => `<button type="button" class="${v===o?'on':''}" data-act="pick" data-id="${f.id}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      break;
    case 'pills':
      inner = `<div class="chips">${f.options.map(o => `<button type="button" class="${v===o?'on':''}" data-act="pick" data-id="${f.id}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      break;
    case 'chips':
      inner = `<div class="chips">${f.options.map(o => `<button type="button" class="${(v||[]).includes(o)?'on':''}" data-act="toggle" data-id="${f.id}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      break;
    case 'text': {
      const opp = f.id === 'opponent' && S.user;
      const known = opp ? scoutData(getEntries()).map(o => o.name) : [];
      inner = `<input class="txt" type="text" data-id="${f.id}" value="${esc(v||'')}" placeholder="${esc(f.ph||'')}" autocomplete="off" autocapitalize="${opp?'words':'sentences'}" enterkeyhint="next"${known.length ? ' list="opps"' : ''}>`
        + (known.length ? `<datalist id="opps">${known.map(n => `<option value="${esc(n)}">`).join('')}</datalist>` : '')
        + (opp && S.form === 'pre' ? '<div id="scouthint"></div>' : '');
      break; }
    case 'textarea':
      inner = `<textarea rows="3" data-id="${f.id}" autocapitalize="sentences" placeholder="${esc(f.ph||'')}">${esc(v||'')}</textarea>`;
      break;
  }
  const help = f.fcopy ? `<p class="fhelp">${esc(f.fcopy)}</p>` : '';
  return `<div class="field"><span class="q">${esc(f.label)}${opt}</span>${help}${inner}</div>`;
}

/* Steps marked deep:true only appear when the player chooses to "go deeper" */
const stepsOf = () => FORMS[S.form].steps.filter(st => !st.deep || S.data._deep);
const hasDeep = () => FORMS[S.form].steps.some(st => st.deep);
/* dir: 'fwd' | 'bwd' | undefined (undefined = same step, keep scroll) */
function renderWizard(dir){
  setTheme(false);
  const F = FORMS[S.form], steps = stepsOf(), st = steps[S.step], total = steps.length;
  const y = window.scrollY;
  const last = S.step === total-1;
  const offerDeep = last && !S.data._deep && hasDeep();
  const reflective = S.user && S.user.level === 'reflective';
  const from = (dir==='fwd' ? S.step : dir==='bwd' ? S.step+2 : S.step+1) / total;
  $app.innerHTML = `
  <div class="wrap">
    <div class="wz-top">
      <div class="wz-bar"><button type="button" class="x" data-act="back" aria-label="Back">${S.step===0?'✕':'‹'}</button><div class="t">${F.icon} ${S.ctx.edit ? 'Edit check-in' : F.title}</div><div class="c">${S.step+1}/${total}</div></div>
      <div class="progress"><i style="transform:scaleX(${from})"></i></div>
    </div>
    <div class="step ${dir||''}">
      <h2>${esc(st.title)}</h2>
      ${st.help ? `<p class="help">${esc(st.help)}</p>` : ''}
      ${visibleFields(st).map(fieldHTML).join('')}
    </div>
    <div class="wz-foot">
      ${offerDeep && reflective ? `<button type="button" class="btn btn-navy btn-block deepbtn" data-act="deeper">Go deeper <span>+2 min · recommended</span></button>` : ''}
      <button type="button" class="btn btn-orange btn-block" data-act="next">${last ? (S.ctx.edit ? 'Save changes' : 'Send to my coach') : 'Next'}</button>
      ${offerDeep && !reflective ? `<button type="button" class="link deeplink" data-act="deeper">Want to go deeper? +2 min</button>` : ''}
    </div>
  </div>`;
  window.scrollTo(0, dir ? 0 : y);
  /* progress bar animates from the previous step (transform only, GPU) */
  if (S.form === 'pre') updateScoutHint();
  const bar = $app.querySelector('.progress i');
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transform = `scaleX(${(S.step+1)/total})`; }));
  saveDraft();
}
/* Tapping an option patches classes in place; only re-render when it reveals or hides a question */
function visibleKey(){ return visibleFields(stepsOf()[S.step]).map(f => f.id).join('|'); }
function choose(id, val, multi){
  const before = visibleKey();
  if (multi) {
    const arr = Array.isArray(S.data[id]) ? S.data[id] : [];
    S.data[id] = arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val];
  } else S.data[id] = val;
  if (visibleKey() !== before) { renderWizard(); return; }
  $app.querySelectorAll(`[data-id="${CSS.escape(id)}"][data-val]`).forEach(b => {
    const on = multi ? S.data[id].includes(b.dataset.val) : String(b.dataset.val) === String(S.data[id]);
    b.classList.toggle('on', on); if (b.hasAttribute('aria-checked')) b.setAttribute('aria-checked', on);
  });
  $app.querySelector(`[data-id="${CSS.escape(id)}"]`)?.closest('.field')?.classList.remove('miss');
  saveDraft();
}

function saveDraft(){ if (S.form && !S.ctx.edit) store.set(kDraft(S.form), { step:S.step, data:S.data }); }

function missingField(){
  const st = stepsOf()[S.step];
  for (const f of visibleFields(st)) {
    if (f.optional || f.type==='info' || f.type==='slider' || f.type==='rate99') continue;
    const v = S.data[f.id];
    if (v === undefined || v === null || (Array.isArray(v) && !v.length) || (typeof v === 'string' && !v.trim())) return f;
  }
  return null;
}

function next(){
  const m = missingField();
  if (m) {
    toast('Missing: ' + m.label);
    const field = $app.querySelector(`[data-id="${CSS.escape(m.id)}"]`)?.closest('.field');
    if (field) { field.classList.remove('miss'); void field.offsetWidth; field.classList.add('miss'); field.scrollIntoView({ block:'center', behavior:'smooth' }); }
    return;
  }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (S.step < stepsOf().length-1) { S.step++; renderWizard('fwd'); }
  else submit();
}
function goDeeper(){
  if (missingField()) return next();   // shows what's missing
  S.data._deep = true; S.step++; renderWizard('fwd');
}
function back(){
  if (S.step > 0) { S.step--; renderWizard('bwd'); }
  else { S.form = null; renderHome(true); }
}

/* ===================== Sending ===================== */
function fmtVal(f, v){
  if (v === undefined || v === null || v === '') return '';
  if (f.type === 'slider') return `${v}/${f.max}`;
  if (f.type === 'rate99') return `${v} · ${lvl(f.levels, v)}`;
  if (f.type === 'scale5') { const o = f.scale[v-1]; return o ? `${o[0]} ${o[1]} (${v}/5)` : String(v); }
  if (Array.isArray(v)) return v.join(', ');
  return String(v);
}
function buildSummary(type, data){
  const lines = [];
  FORMS[type].steps.forEach(st => {
    const rows = expand(st.fields).filter(f => f.type!=='info' && (!f.showIf || f.showIf(data))).map(f => {
      const v = fmtVal(f, data[f.id]); return v ? `• ${f.label}: ${v}` : '';
    }).filter(Boolean);
    if (rows.length) lines.push(`— ${st.title.toUpperCase()}`, ...rows, '');
  });
  return lines.join('\n');
}

async function postForm(entry){
  const F = FORMS[entry.type], d = entry.data;
  const payload = {
    'form-name': NETLIFY_FORM,
    jugador: S.user.name,
    tipo: F.title + (entry.editedAt ? ' (edited)' : ''),
    fecha: fmtDate(entry.date),
    rival: d.opponent || '',
    resultado: entry.type==='post' ? `${d.result||''} ${d.score||''}`.trim() : '',
    indicador: F.indicator(d),
    resumen: buildSummary(entry.type, d)
  };
  const r = await fetch('/', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(payload).toString() });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}

/* 1) save on the server (what the coach sees), 2) email copy */
async function send(entry){
  if (entry.sent === false) {
    await api('/entries', { method:'POST', pin:S.pin, player:S.user.id,
      body:{ edit: !!entry.edit, entry:{ id:entry.id, type:entry.type, date:entry.date, data:entry.data, pre:entry.pre } } });
    entry.sent = true; entry.edit = false;
  }
  if (!entry.mailed) { try { await postForm(entry); entry.mailed = true; } catch(e) {} }
}
function saveFlags(entry){
  const E = getEntries(); const e = E.find(x => x.id === entry.id);
  if (e) { e.sent = entry.sent; e.mailed = entry.mailed; e.edit = entry.edit; setEntries(E); }
}

async function submit(){
  const btn = $app.querySelector('[data-act=next]'); if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = 'Sending…'; }
  if (S.ctx.edit) return submitEdit();
  if (S.form === 'daily' && todayDaily()) { toast('You already did today’s check-in'); S.form = null; return renderHome(true); }
  const when = S.data.when === 'Yesterday' ? new Date(Date.now() - 864e5) : new Date();
  const entry = { id: Date.now().toString(36) + Math.random().toString(36).slice(2,5), type: S.form, date: when.toISOString(),
                  data: { ...S.data }, pre: S.form==='post' && S.ctx.pre ? S.ctx.pre.id : undefined, sent:false, mailed:false };
  const E = getEntries(); E.unshift(entry); setEntries(E);
  store.del(kDraft(S.form));
  try { await send(entry); } catch(e) { if (e.status === 401) toast('Please sign in again'); else if (e.status === 409) { handleSendError(entry, e); S.form = null; return renderHome(true); } }
  saveFlags(entry);
  renderDone(entry, entry.sent);
}

async function submitEdit(){
  const orig = S.ctx.edit;
  if (madridDay(orig.date) !== madridDay(new Date())) { toast('Locked at midnight: check-ins can only be edited the same day'); S.form = null; return renderHome(true); }
  const E = getEntries(); const e = E.find(x => x.id === orig.id);
  e.data = { ...S.data }; e.sent = false; e.mailed = false; e.edit = true; e.editedAt = new Date().toISOString();
  setEntries(E);
  try { await send(e); } catch(err) { handleSendError(e, err); }
  saveFlags(e);
  renderDone(e, e.sent, true);
}
/* 409 from the server: daily already done today (another phone) or locked after midnight */
function handleSendError(e, err){
  if (err.status !== 409) return;
  const E = getEntries();
  if (e.edit) { const x = E.find(y => y.id === e.id); if (x) { x.sent = true; x.mailed = true; x.edit = false; } toast('Locked at midnight: that check-in can’t be edited anymore'); }
  else { const i = E.findIndex(y => y.id === e.id); if (i > -1) E.splice(i, 1); toast('You already did today’s check-in'); }
  setEntries(E); e.sent = true; e.mailed = true; syncEntries();
}

async function retryPending(){
  if (!S.user || retryPending.busy) return;
  retryPending.busy = true;
  try {
    for (const e of getEntries().filter(x => x.sent === false || x.mailed === false)) {
      try { await send(e); saveFlags(e); } catch(err) { if (err.status === 409) { handleSendError(e, err); continue; } break; }
    }
  } finally { retryPending.busy = false; }
  if (onPlayerHome()) renderHome();
}

  if ((d.talk || '').length) extra += `<div class="words soft"><div class="k">Got it</div><div class="w small">Your coach will find a moment to talk with you.</div></div>`;
