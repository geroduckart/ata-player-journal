  --orange:#E35B2A; --orange-hover:#CC5224; --orange-soft:#FCEDE6;
  --bg:#FBFAF8; --card:#FFFFFF; --ink:#0F1720; --muted:#546073; --line:#E0E2E8;
  --ok:#1F9D6B;
  --radius:16px;
  --font:'Figtree',system-ui,-apple-system,BlinkMacSystemFont,sans-serif;
  /* Motion: same curves as the academy site */
  --ease-out:cubic-bezier(0.23,1,0.32,1);
  --ease-in-out:cubic-bezier(0.77,0,0.175,1);
  /* Safe areas (notch, Dynamic Island, home indicator) */
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --sal:env(safe-area-inset-left,0px); --sar:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;background:var(--bg)}
html.dark-top{background:var(--navy-2)}
body{min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;overscroll-behavior-y:none;text-rendering:optimizeLegibility}
button,a,input,textarea,[data-act]{touch-action:manipulation}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea{font:inherit;color:inherit;-webkit-appearance:none;appearance:none;border-radius:0}
:focus{outline:none}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-left:max(18px,var(--sal));padding-right:max(18px,var(--sar))}
.brand{font-size:11px;letter-spacing:.18em;font-weight:700;text-transform:uppercase;line-height:1.4}
.logo-word{display:block;width:210px;max-width:70%;height:auto}
.logo-mono{display:block;height:34px;width:auto}
.topbrand{display:flex;align-items:center;gap:10px}
.topbrand span{font-size:11px;letter-spacing:.16em;font-weight:700;text-transform:uppercase;color:var(--muted)}
.hero .wm{position:absolute;right:22px;bottom:22px;height:44px;width:auto;opacity:.14}

/* ===== Press feedback: every tappable thing answers instantly ===== */
.btn,.player,.action,.emo button,.chips button,.choices button,.wz-bar .x,.link{transition:transform 160ms var(--ease-out),background-color 160ms ease,border-color 160ms ease,color 160ms ease}
.btn:active,.player:active,.action:active,.wz-bar .x:active{transform:scale(.97)}
.emo button:active,.chips button:active,.choices button:active{transform:scale(.96)}
@media (hover:hover) and (pointer:fine){
  .btn-orange:hover{background:var(--orange-hover)}
  .action:hover{border-color:#CBD0DA}
  .chips button:not(.on):hover,.choices button:not(.on):hover,.emo button:not(.on):hover{border-color:#CBD0DA}
  .player:not(.sel):hover{background:rgba(255,255,255,.1)}
  .link:hover{color:var(--ink)}
}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:56px;padding:0 28px;border-radius:999px;font-weight:700;font-size:17px}
.btn-orange{background:var(--orange);color:#fff}
.btn-navy{background:var(--navy);color:#fff}
.btn-block{width:100%}
.btn[disabled]{opacity:.35;pointer-events:none}
.link{font-size:15px;font-weight:600;color:var(--muted);padding:10px 4px;margin-right:-4px;min-height:44px}

/* ===== Login ===== */
.login{min-height:100vh;min-height:100dvh;background:radial-gradient(120% 70% at 100% 0%,var(--navy) 0%,var(--navy-2) 70%);color:#fff;padding:calc(28px + var(--sat)) 0 calc(32px + var(--sab));position:relative;overflow:hidden;display:flex;flex-direction:column}
.login .wrap{position:relative;z-index:1;width:100%;flex:1;display:flex;flex-direction:column}
.login .court{position:absolute;right:-120px;top:calc(120px + var(--sat));width:360px;height:360px;border:2px solid rgba(227,91,42,.25);border-radius:50%;pointer-events:none}
.login .court:after{content:"";position:absolute;inset:40px;border:2px solid rgba(255,255,255,.06);border-radius:50%}
.login h1{font-size:clamp(40px,12vw,52px);line-height:1;font-weight:700;letter-spacing:-.03em;margin:clamp(36px,8vh,72px) 0 14px}
.login h1 span{color:var(--orange)}
.login .lead{color:rgba(255,255,255,.72);font-size:16px;line-height:1.55;max-width:34ch}
.players{display:grid;gap:12px;margin-top:36px}
.player{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:var(--radius);background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.14);text-align:left;color:#fff;width:100%;min-height:72px}
.player.sel{background:#fff;color:var(--navy);border-color:#fff}
.player .nm{font-weight:700;font-size:18px}
.player .sub{font-size:13px;opacity:.6}
.avatar{width:46px;height:46px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-weight:700;font-size:18px;flex:none}
.pinbox{margin-top:22px;display:none}
.pinbox.show{display:block;animation:rise 260ms var(--ease-out) both}
.pinbox label{font-size:13px;color:rgba(255,255,255,.7);font-weight:600;display:block;margin-bottom:8px}
.pin{width:100%;height:64px;border-radius:var(--radius);border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.07);color:#fff;font-size:28px;letter-spacing:.6em;text-indent:.6em;text-align:center;font-weight:700;margin-bottom:14px;transition:border-color 160ms ease}
.pin:focus{border-color:var(--orange)}
.pin:focus-visible,.txt:focus-visible,textarea:focus-visible{outline:none}
.pin.shake{animation:shake 320ms var(--ease-out)}
.motto{margin-top:auto;padding-top:40px;font-size:13px;color:rgba(255,255,255,.45);line-height:1.5}

/* ===== Home ===== */
.top{display:flex;justify-content:space-between;align-items:center;padding:calc(14px + var(--sat)) 0 14px}
.hero{background:var(--navy);color:#fff;border-radius:24px;padding:26px 24px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:2px solid rgba(227,91,42,.35)}
.hero:after{content:"";position:absolute;right:-30px;top:-30px;width:140px;height:140px;border-radius:50%;border:2px solid rgba(255,255,255,.08)}
.hero .date{font-size:13px;color:rgba(255,255,255,.6);font-weight:500;text-transform:capitalize}
.hero h2{font-size:30px;font-weight:700;letter-spacing:-.02em;margin:6px 0 16px;line-height:1.1}
.hero h2 span{color:var(--orange)}
.pillrow{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1;max-width:calc(100% - 56px)}
.pill{font-size:12px;font-weight:700;padding:7px 12px;border-radius:999px;background:rgba(255,255,255,.1);font-variant-numeric:tabular-nums}
.pill.o{background:var(--orange)}
.actions{display:grid;gap:12px;margin:16px 0 0}
.action{display:flex;align-items:center;gap:16px;background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid var(--line);text-align:left;width:100%;box-shadow:0 1px 2px rgba(15,23,32,.04)}
.action .ic{width:52px;height:52px;border-radius:14px;background:var(--orange-soft);display:grid;place-items:center;font-size:24px;flex:none}
.action h3{font-size:17px;font-weight:700}
.action p{font-size:14px;color:var(--muted);margin-top:2px;line-height:1.35}
.action .arr{margin-left:auto;color:var(--orange);font-size:24px;font-weight:700;padding-left:4px}
.action .draft{font-size:12px;font-weight:700;color:var(--orange);margin-top:4px}
.stitle{font-size:12px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:30px 0 12px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 12px 8px;min-width:0}
.stat .k{font-size:11px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat .v{font-size:26px;font-weight:700;margin:2px 0 4px;font-variant-numeric:tabular-nums}
.stat .v small{font-size:12px;color:var(--muted);font-weight:600}
.stat svg{display:block;width:100%;height:28px}
.hist{margin-bottom:10px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.hist summary{list-style:none;padding:14px 16px;cursor:pointer;display:flex;gap:12px;align-items:center;min-height:60px}
.hist summary::-webkit-details-marker{display:none}
.hist summary:after{content:"›";margin-left:auto;color:var(--muted);font-size:20px;transition:transform 200ms var(--ease-out)}
.hist[open] summary:after{transform:rotate(90deg)}
.hist .when{font-size:12px;color:var(--muted);font-weight:500;text-transform:capitalize}
.hist .ind{font-size:14px;font-weight:600;margin-top:2px}
.hist[open] summary{border-bottom:1px solid var(--line)}
.hist[open] .detail{animation:fade 200ms var(--ease-out)}
.tag{font-size:11px;font-weight:700;padding:5px 10px;border-radius:999px;background:var(--orange-soft);color:var(--orange);white-space:nowrap}
.tag.n{background:var(--navy);color:#fff}
.tag.g{background:#E8F6F0;color:var(--ok)}
.detail{padding:6px 16px 14px}
.detail h4{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--orange);margin:14px 0 6px}
.row{padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.row:last-child{border-bottom:0}
.row .l{color:var(--muted);font-size:12px;font-weight:600;display:block}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:var(--radius);padding:22px;text-align:center;color:var(--muted);font-size:15px;line-height:1.5}
.pending{margin-top:14px;font-size:14px;background:#FFF8E6;color:#8A5A00;border-radius:14px;padding:10px 14px}
.foot{padding:30px 0 calc(40px + var(--sab));text-align:center}

/* Staggered entry on home: only when arriving, never on silent refresh */
.enter .hero,.enter .action,.enter .stitle,.enter .stats,.enter .hist,.enter .empty{animation:rise 360ms var(--ease-out) both}
.enter .action:nth-child(1){animation-delay:50ms}
.enter .action:nth-child(2){animation-delay:90ms}
.enter .action:nth-child(3){animation-delay:130ms}
.enter .stitle,.enter .stats,.enter .hist,.enter .empty{animation-delay:170ms}

/* ===== Form ===== */
.wz-top{position:sticky;top:0;background:rgba(251,250,248,.86);-webkit-backdrop-filter:saturate(180%) blur(16px);backdrop-filter:saturate(180%) blur(16px);padding:calc(12px + var(--sat)) 0 10px;z-index:5;margin:0 calc(-1 * max(18px,var(--sar))) 0 calc(-1 * max(18px,var(--sal)));padding-left:max(18px,var(--sal));padding-right:max(18px,var(--sar))}
.wz-bar{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.wz-bar .x{width:44px;height:44px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;font-size:20px;font-weight:700;flex:none}
.wz-bar .t{font-size:14px;font-weight:700;flex:1}
.wz-bar .c{font-size:13px;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums}
.progress{height:6px;border-radius:9px;background:var(--line);overflow:hidden}
.progress i{display:block;height:100%;width:100%;background:var(--orange);border-radius:9px;transform-origin:left;transition:transform 300ms var(--ease-out)}
.step h2{font-size:clamp(26px,8vw,32px);font-weight:700;letter-spacing:-.025em;line-height:1.08;margin:18px 0 8px}
.step .help{color:var(--muted);font-size:15px;line-height:1.5}
.step.fwd{animation:inR 240ms var(--ease-out) both}
.step.bwd{animation:inL 240ms var(--ease-out) both}
.field{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;margin-top:14px}
.field .q{display:block;font-weight:700;font-size:16px;line-height:1.35;margin-bottom:12px}
.field .q .opt{font-weight:500;color:var(--muted);font-size:12px}
.field .fhelp{font-size:13px;color:var(--muted);margin:-6px 0 12px;line-height:1.45}
.field.miss{border-color:var(--orange);animation:shake 320ms var(--ease-out)}
.sl-val{font-size:44px;font-weight:700;color:var(--orange);text-align:center;line-height:1;margin-bottom:14px;font-variant-numeric:tabular-nums}
.sl-val small{font-size:16px;color:var(--muted)}
.sl-ends{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:10px;font-weight:500}
input[type=range]{width:100%;height:36px;background:transparent;cursor:pointer;display:block}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:9px;background:linear-gradient(to right,var(--orange) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:8px;border-radius:9px;background:linear-gradient(to right,var(--orange) var(--p),var(--line) var(--p))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:32px;height:32px;margin-top:-12px;border-radius:50%;background:#fff;border:3px solid var(--orange);box-shadow:0 2px 8px rgba(15,23,32,.2);transition:transform 160ms var(--ease-out)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.12)}
input[type=range]::-moz-range-thumb{width:26px;height:26px;border-radius:50%;background:#fff;border:3px solid var(--orange);box-shadow:0 2px 8px rgba(15,23,32,.2)}
.emo{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.emo button{border:1.5px solid var(--line);border-radius:14px;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:13px;font-weight:600;text-align:center;line-height:1.25;min-height:84px;justify-content:center}
.emo button span{font-size:28px;line-height:1}
.emo button.on{border-color:var(--orange);background:var(--orange-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{padding:10px 15px;border-radius:999px;border:1.5px solid var(--line);font-size:15px;font-weight:600;min-height:44px}
.chips button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.choices{display:grid;gap:8px}
.choices button{padding:15px 16px;border-radius:14px;border:1.5px solid var(--line);text-align:left;font-weight:600;font-size:16px;min-height:52px}
.choices button.on{border-color:var(--orange);background:var(--orange-soft)}
.txt,textarea{width:100%;border:1.5px solid var(--line);border-radius:14px;padding:14px;font-size:16px;background:#fff;resize:vertical;line-height:1.45;transition:border-color 160ms ease}
textarea{min-height:96px;field-sizing:content;max-height:280px}
.txt:focus,textarea:focus{border-color:var(--orange)}
::placeholder{color:#9AA3B2}
.plan{background:var(--navy);color:#fff;border-radius:var(--radius);padding:18px;margin-top:14px}
.plan .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700;margin:10px 0 4px}
.plan .k:first-child{margin-top:0}
.plan p{font-size:15px;line-height:1.5;color:rgba(255,255,255,.88)}
.wz-foot{position:sticky;bottom:0;padding:22px 0 calc(14px + max(var(--sab),6px));background:linear-gradient(to bottom,rgba(251,250,248,0),var(--bg) 35%);margin-top:6px;z-index:5}

/* ===== Done ===== */
.done{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;padding:calc(40px + var(--sat)) 0 calc(40px + var(--sab))}
.done > *{animation:rise 400ms var(--ease-out) both}
.done > *:nth-child(2){animation-delay:60ms}.done > *:nth-child(3){animation-delay:110ms}
.done > *:nth-child(4){animation-delay:160ms}.done > *:nth-child(5){animation-delay:210ms}.done > *:nth-child(6){animation-delay:260ms}
.done .ball{width:84px;height:84px;border-radius:50%;background:var(--orange);color:#fff;display:grid;place-items:center;font-size:40px;font-weight:700;margin-bottom:26px;animation:pop 460ms var(--ease-out) both}
.done h2{font-size:clamp(30px,9vw,36px);font-weight:700;letter-spacing:-.025em;line-height:1.08}
.done p{color:var(--muted);font-size:17px;line-height:1.55;margin-top:12px}
.done .words{margin-top:22px;background:var(--navy);color:#fff;border-radius:var(--radius);padding:20px}
.done .words .k{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--orange);font-weight:700}
.done .words .w{font-size:22px;font-weight:700;margin-top:6px;line-height:1.3;overflow-wrap:anywhere}
.status{margin-top:18px;font-size:14px;font-weight:600}
.status.ok{color:var(--ok)} .status.wait{color:#8A5A00}

/* Toast: drops from the top (never hidden by the iOS keyboard), leaves faster than it arrives */
.toast{position:fixed;left:50%;top:calc(12px + var(--sat));transform:translate(-50%,-12px) scale(.96);background:var(--navy);color:#fff;padding:12px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;transition:opacity 150ms ease,transform 150ms ease;pointer-events:none;z-index:50;max-width:min(90vw,420px);text-align:center;box-shadow:0 8px 24px rgba(15,23,32,.18)}
html.dark-top .toast{background:#fff;color:var(--navy)}
.toast.show{opacity:1;transform:translate(-50%,0) scale(1);transition:opacity 220ms var(--ease-out),transform 260ms var(--ease-out)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes inR{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}
.fade{animation:fade 240ms var(--ease-out)}

/* Desktop / larger screens */
@media (min-width:720px){
  body{background:var(--bg)}
  .login .wrap{justify-content:center;max-width:480px}
  .login h1{margin-top:28px}
  .motto{margin-top:40px}
  .action{padding:20px}
  .wz-foot{padding-bottom:28px}
}

/* Reduced motion: keep fades that help comprehension, remove movement */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:1ms!important;animation-delay:0ms!important;transition-duration:1ms!important}
  .toast,.toast.show{transition:opacity 150ms ease!important}
}
</style>

<script>
/* =====================================================================
   SETUP: add each player's name and a 4-digit PIN here.
   To add a player, copy one line and change id, name and pin.
   ===================================================================== */
const PLAYERS = [
  { id: 'matej',  name: 'Matej',  pin: '4826' },

];

/* ===================== State and storage ===================== */
const S = { user:null, selected:null, form:null, step:0, data:{}, ctx:{} };
const store = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} },
  del(k){ try { localStorage.removeItem(k); } catch(e){} }
};
const kEntries = () => 'ata_entries_' + S.user.id;
const kDraft = f => 'ata_draft_' + S.user.id + '_' + f;
const getEntries = () => store.get(kEntries(), []);
const setEntries = e => store.set(kEntries(), e);

const LOCALE = 'en-GB';
const $app = document.getElementById('app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const initials = n => n.split(/\s+/).map(w => w[0]).join('').slice(0,2).toUpperCase();
const fmtDate = iso => { const d = new Date(iso); return d.toLocaleDateString(LOCALE,{weekday:'short',day:'numeric',month:'short'}) + ' · ' + d.toLocaleTimeString(LOCALE,{hour:'2-digit',minute:'2-digit'}); };

function toast(msg){
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._t); toast._t = setTimeout(() => t.classList.remove('show'), 2200);
}
/* Status bar / browser chrome follows the screen colour (iOS Safari, Chrome Android) */

/* ===================== Home ===================== */
function spark(vals){
  if (vals.length < 2) return '<svg viewBox="0 0 100 28"></svg>';
  const pts = vals.map((v,i) => `${(i/(vals.length-1))*96+2},${26-((v-1)/9)*24}`).join(' ');
  return `<svg viewBox="0 0 100 28" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="var(--orange)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" vector-effect="non-scaling-stroke"/></svg>`;
}
function series(entries, type, key){
  return entries.filter(e => e.type===type && typeof e.data[key]==='number').slice(0,10).reverse().map(e => e.data[key]);
}
function streak(entries){
  const days = new Set(entries.map(e => new Date(e.date).toDateString()));
  const d = new Date(); if (!days.has(d.toDateString())) d.setDate(d.getDate()-1);
  let n = 0; while (days.has(d.toDateString())) { n++; d.setDate(d.getDate()-1); }
  return n;
}
function greeting(){ const h = new Date().getHours(); return h < 12 ? 'Good morning' : h < 19 ? 'Good afternoon' : 'Good evening'; }

function renderHome(enter){
  setTheme(false);
  const E = getEntries();

  const stat = (k, type, key) => { const s = series(E, type, key); const last = s.length ? s[s.length-1] : '–';
    return `<div class="stat"><div class="k">${k}</div><div class="v">${last}<small>${s.length?'/10':''}</small></div>${spark(s)}</div>`; };

    return `<button class="action" data-act="start" data-val="${f}"><div class="ic">${F.icon}</div><div><h3>${F.title}</h3><p>${F.desc}</p>${draft?'<div class="draft">● You have one in progress</div>':''}</div><div class="arr">›</div></button>`; };
  const first = S.user.name.split(' ')[0];

  $app.innerHTML = `
  <div class="wrap ${enter?'enter':''}">
    <div class="top"><div class="topbrand"><img class="logo-mono" src="${LOGO.MONO_NAVY}" alt="ATA"><span>Player Journal</span></div><button class="link" data-act="logout">Sign out</button></div>
    <div class="hero">
      <img class="wm" src="${LOGO.MONO_WHITE}" alt="">
      <div class="date">${new Date().toLocaleDateString(LOCALE,{weekday:'long',day:'numeric',month:'long'})}</div>
      <h2>${greeting()},<br><span>${esc(first)}.</span></h2>
      <div class="pillrow">
        <span class="pill o">🔥 ${st}-day streak</span>
        <span class="pill">${E.length} ${E.length===1?'entry':'entries'}</span>
        <span class="pill">${matches.length} ${matches.length===1?'match':'matches'} · ${wins} won</span>
      </div>
    </div>
    <div class="actions">${actionBtn('daily')}${actionBtn('pre')}${actionBtn('post')}</div>
    ${pend ? `<div class="pending">⏳ ${pend} ${pend>1?'entries':'entry'} waiting to be sent. They’ll send automatically when you’re back online.</div>` : ''}
    <div class="stitle">Your progress</div>
    <div class="stats">${stat('Energy','daily','energy')}${stat('Confidence','pre','confidence')}${stat('Match rating','post','rating')}</div>
    <div class="stitle">Your history</div>
    ${E.length ? E.slice(0,30).map(histItem).join('') : `<div class="empty">Nothing here yet.<br>Start with today’s check-in: it takes a minute.</div>`}
    <div class="foot"><div class="brand" style="color:var(--muted)">We don’t teach you our tennis. We help you develop yours.</div></div>
  </div>`;

function histItem(e){
  const F = FORMS[e.type]; if (!F) return '';
  const cls = e.type==='post' ? (e.data.result==='Won' ? 'g' : 'n') : e.type==='pre' ? 'n' : '';
  let body = '';
  F.steps.forEach(st => {
    const rows = st.fields.filter(f => f.type!=='info' && (!f.showIf || f.showIf(e.data))).map(f => {
      const v = fmtVal(f, e.data[f.id]); return v ? `<div class="row"><span class="l">${esc(f.label)}</span>${esc(v)}</div>` : '';
    }).join('');
    if (rows) body += `<h4>${esc(st.title)}</h4>${rows}`;
  });
  return `<details class="hist"><summary><span class="tag ${cls}">${F.tag}</span><div><div class="when">${fmtDate(e.date)}${e.sent?'':' · ⏳'}</div><div class="ind">${esc(F.indicator(e.data))}</div></div></summary><div class="detail">${body}</div></details>`;
}

/* ===================== Step-by-step form ===================== */
function startForm(f){
  S.form = f; S.ctx = {};
  const draft = store.get(kDraft(f), null);
  S.data = draft ? draft.data : {};
  S.step = draft ? Math.min(draft.step, FORMS[f].steps.length-1) : 0;
  if (f === 'post') {
    const pre = getEntries().find(e => e.type==='pre' && !e.linked && (Date.now()-new Date(e.date)) < 4*864e5);
    if (pre) { S.ctx.pre = pre; if (!S.data.opponent) S.data.opponent = pre.data.opponent; if (!S.data.tournament) S.data.tournament = pre.data.tournament; }
  }
  renderWizard('fwd');
}

function renderPrePlan(){
  const p = S.ctx.pre.data;
  const block = (k, v) => v && (Array.isArray(v) ? v.length : String(v).trim()) ? `<div class="k">${k}</div><p>${esc(Array.isArray(v)?v.join(' · '):v)}</p>` : '';
  return `<div class="plan">${block('Your plan A', p.plan_a)}${block('Tactics', p.tactics)}${block('Plan B', p.plan_b)}${block('Process goal', p.process)}${block('Your words', p.words)}</div>`;
}

const visibleFields = st => st.fields.filter(f => !f.showIf || f.showIf(S.data));

function fieldHTML(f){
  if (f.type === 'info') return f.render();
  const v = S.data[f.id];
  const opt = f.optional ? ' <span class="opt">(optional)</span>' : '';
  let inner = '';
  switch (f.type){
    case 'slider': {
      if (typeof v !== 'number') S.data[f.id] = f.def ?? 5;
      const val = S.data[f.id], p = ((val-f.min)/(f.max-f.min))*100;
      inner = `<div class="sl-val" id="sv-${f.id}">${val}<small>/${f.max}</small></div>
        <input type="range" min="${f.min}" max="${f.max}" step="1" value="${val}" data-id="${f.id}" style="--p:${p}%" aria-label="${esc(f.label)}">
        <div class="sl-ends"><span>${esc(f.left)}</span><span>${esc(f.right)}</span></div>`;
      break; }
    case 'emoji':
      inner = `<div class="emo">${f.options.map(([e,l]) => { const val = e+' '+l;
        return `<button type="button" class="${v===val?'on':''}" data-act="pick" data-id="${f.id}" data-val="${esc(val)}"><span>${e}</span>${esc(l)}</button>`; }).join('')}</div>`;
      break;
    case 'choice':
      inner = `<div class="choices">${f.options.map(o => `<button type="button" class="${v===o?'on':''}" data-act="pick" data-id="${f.id}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      break;
    case 'pills':
      inner = `<div class="chips">${f.options.map(o => `<button type="button" class="${v===o?'on':''}" data-act="pick" data-id="${f.id}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      break;
    case 'chips':
      inner = `<div class="chips">${f.options.map(o => `<button type="button" class="${(v||[]).includes(o)?'on':''}" data-act="toggle" data-id="${f.id}" data-val="${esc(o)}">${esc(o)}</button>`).join('')}</div>`;
      break;
    case 'text':
      inner = `<input class="txt" type="text" data-id="${f.id}" value="${esc(v||'')}" placeholder="${esc(f.ph||'')}" autocomplete="off" autocapitalize="sentences" enterkeyhint="next">`;
      break;
    case 'textarea':
      inner = `<textarea rows="3" data-id="${f.id}" autocapitalize="sentences" placeholder="${esc(f.ph||'')}">${esc(v||'')}</textarea>`;
      break;
  }
  const help = f.fcopy ? `<p class="fhelp">${esc(f.fcopy)}</p>` : '';
  return `<div class="field"><span class="q">${esc(f.label)}${opt}</span>${help}${inner}</div>`;
}

/* dir: 'fwd' | 'bwd' | undefined (undefined = same step, keep scroll) */
function renderWizard(dir){
  setTheme(false);
  const F = FORMS[S.form], st = F.steps[S.step], total = F.steps.length;
  const y = window.scrollY;
  const last = S.step === total-1;
  $app.innerHTML = `
  <div class="wrap">
    <div class="wz-top">
      <div class="wz-bar"><button class="x" data-act="back" aria-label="Back">${S.step===0?'✕':'‹'}</button><div class="t">${F.icon} ${F.title}</div><div class="c">${S.step+1}/${total}</div></div>
      <div class="progress"><i style="transform:scaleX(${(dir==='fwd'?S.step:dir==='bwd'?S.step+2:S.step+1)/total})"></i></div>
    </div>
    <div class="step ${dir||''}">
      <h2>${esc(st.title)}</h2>
      ${st.help ? `<p class="help">${esc(st.help)}</p>` : ''}
      ${visibleFields(st).map(fieldHTML).join('')}
    </div>
    <div class="wz-foot"><button type="button" class="btn btn-orange btn-block" data-act="next">${last ? 'Send to my coach' : 'Next'}</button></div>
  </div>`;
  window.scrollTo(0, dir ? 0 : y);
  /* progress bar animates from the previous step's width (transform only, GPU) */
  const bar = $app.querySelector('.progress i');
  requestAnimationFrame(() => requestAnimationFrame(() => { bar.style.transform = `scaleX(${(S.step+1)/total})`; }));
  saveDraft();
}
/* Tapping an option patches classes in place; only re-render when it reveals or hides a question */
function visibleKey(){ return visibleFields(FORMS[S.form].steps[S.step]).map(f => f.id).join('|'); }
function choose(id, val, multi){
  const before = visibleKey();
  if (multi) {
    const arr = Array.isArray(S.data[id]) ? S.data[id] : [];
    S.data[id] = arr.includes(val) ? arr.filter(x => x !== val) : [...arr, val];
  } else S.data[id] = val;
  if (visibleKey() !== before) { renderWizard(); return; }
  $app.querySelectorAll(`[data-id="${CSS.escape(id)}"][data-val]`).forEach(b => {
    b.classList.toggle('on', multi ? S.data[id].includes(b.dataset.val) : b.dataset.val === S.data[id]);
  });
  const field = $app.querySelector(`[data-id="${CSS.escape(id)}"]`)?.closest('.field'); field?.classList.remove('miss');
  saveDraft();
}

function saveDraft(){ if (S.form) store.set(kDraft(S.form), { step:S.step, data:S.data }); }

function missingField(){
  const st = FORMS[S.form].steps[S.step];
  for (const f of visibleFields(st)) {
    if (f.optional || f.type==='info' || f.type==='slider') continue;
    const v = S.data[f.id];
    if (v === undefined || v === null || (Array.isArray(v) && !v.length) || (typeof v === 'string' && !v.trim())) return f;
  }
  return null;
}

function next(){
  const m = missingField();
  if (m) {
    toast('Missing: ' + m.label);
    const field = $app.querySelector(`[data-id="${CSS.escape(m.id)}"]`)?.closest('.field');
    if (field) { field.classList.remove('miss'); void field.offsetWidth; field.classList.add('miss'); field.scrollIntoView({ block:'center', behavior:'smooth' }); }
    return;
  }
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (S.step < FORMS[S.form].steps.length-1) { S.step++; renderWizard('fwd'); }
  else submit();
}
function back(){
  if (S.step > 0) { S.step--; renderWizard('bwd'); }
  else { S.form = null; renderHome(true); }
}

/* ===================== Sending (Netlify Forms) ===================== */
function fmtVal(f, v){
  if (v === undefined || v === null || v === '') return '';
  if (f.type === 'slider') return `${v}/${f.max}`;
  if (Array.isArray(v)) return v.join(', ');
  return String(v);
}
function buildSummary(type, data){
  const lines = [];
  FORMS[type].steps.forEach(st => {
    const rows = st.fields.filter(f => f.type!=='info' && (!f.showIf || f.showIf(data))).map(f => {
      const v = fmtVal(f, data[f.id]); return v ? `• ${f.label}: ${v}` : '';
    }).filter(Boolean);
    if (rows.length) lines.push(`— ${st.title.toUpperCase()}`, ...rows, '');
  });
  return lines.join('\n');
}

async function send(entry, userName){
  const F = FORMS[entry.type], d = entry.data;
  const payload = {
    'form-name': NETLIFY_FORM,
    jugador: userName,
    tipo: F.title,
    fecha: fmtDate(entry.date),
    rival: d.opponent || '',
    resultado: entry.type==='post' ? `${d.result||''} ${d.score||''}`.trim() : '',
    indicador: F.indicator(d),
    resumen: buildSummary(entry.type, d)
  };
  const r = await fetch('/', { method:'POST', headers:{'Content-Type':'application/x-www-form-urlencoded'}, body:new URLSearchParams(payload).toString() });
  if (!r.ok) throw new Error('HTTP ' + r.status);
}

async function submit(){
  const btn = $app.querySelector('[data-act=next]'); if (btn) { if (btn.disabled) return; btn.disabled = true; btn.textContent = 'Sending…'; }
  const entry = { id: Date.now().toString(36), type: S.form, date: new Date().toISOString(), data: { ...S.data }, sent: false };
  const E = getEntries();
  if (S.form === 'post' && S.ctx.pre) { const p = E.find(e => e.id === S.ctx.pre.id); if (p) p.linked = true; }
  E.unshift(entry); setEntries(E);
  store.del(kDraft(S.form));
  let ok = false;
  try { await send(entry, S.user.name); ok = true; markSent(entry.id); } catch(e) {}
  renderDone(entry, ok);
}
function markSent(id){ const E = getEntries(); const e = E.find(x => x.id === id); if (e) { e.sent = true; setEntries(E); } }

async function retryPending(){
  if (!S.user) return;
  for (const e of getEntries().filter(x => !x.sent)) {
    try { await send(e, S.user.name); markSent(e.id); } catch(err) { return; }
  }
  if (!S.form && $app.querySelector('.top')) renderHome();
}
window.addEventListener('online', retryPending);

function renderDone(entry, ok){
  const F = FORMS[entry.type], d = entry.data;
  let extra = '';
  if (entry.type === 'pre' && d.words) extra = `<div class="words"><div class="k">Your words for today</div><div class="w">${esc(d.words)}</div></div>`;
  if (entry.type === 'post' && d.train) extra = `<div class="words"><div class="k">This week you train</div><div class="w">${esc(d.train)}</div></div>`;
  if (entry.type === 'daily' && d.tomorrow) extra = `<div class="words"><div class="k">Tomorrow’s focus</div><div class="w">${esc(d.tomorrow)}</div></div>`;
  S.form = null; setTheme(false);
  $app.innerHTML = `
  <div class="wrap done">
    <div class="ball">✓</div>
    <h2>${F.done.h}</h2>
    <p>${F.done.p}</p>
    ${extra}
    <div class="status ${ok?'ok':'wait'}">${ok ? '✓ Sent to your coach' : '⏳ Saved. It’ll send automatically when you’re back online.'}</div>
    <div style="margin-top:26px"><button type="button" class="btn btn-navy btn-block" data-act="home">Back to home</button></div>
  </div>`;
  window.scrollTo(0,0);
}

/* ===================== Events ===================== */
$app.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act, id = b.dataset.id, val = b.dataset.val;
  switch (act){
    case 'selplayer': selectPlayer(val); break;
    case 'login': doLogin(); break;
    case 'logout': store.del('ata_user'); S.user = null; S.selected = null; renderLogin(); break;
    case 'start': startForm(val); break;
    case 'home': renderHome(true); break;
    case 'next': next(); break;
    case 'back': back(); break;
    case 'pick': choose(id, val, false); break;
    case 'toggle': choose(id, val, true); break;
  }
});
$app.addEventListener('input', e => {
  const t = e.target, id = t.dataset && t.dataset.id; if (!id) return;
  if (t.type === 'range') {
    const v = +t.value; S.data[id] = v;
    t.style.setProperty('--p', ((v - +t.min) / (+t.max - +t.min)) * 100 + '%');
    const sv = document.getElementById('sv-' + id); if (sv) sv.innerHTML = `${v}<small>/${t.max}</small>`;
  } else {
    S.data[id] = t.value;
    if (t.value.trim()) t.closest('.field')?.classList.remove('miss');
  }
  saveDraft();
});
$app.addEventListener('keydown', e => {
  if (e.target.id === 'pin' && e.key === 'Enter') doLogin();
  /* Enter on a one-line answer moves on, like the keyboard's "Next" key */
  if (e.target.classList.contains('txt') && e.key === 'Enter') { e.preventDefault(); next(); }
});
/* PIN: sign in automatically once 4 digits are typed */
$app.addEventListener('input', e => {
  if (e.target.id !== 'pin') return;
  e.target.value = e.target.value.replace(/\D/g,'').slice(0,4);
  if (e.target.value.length === 4) doLogin();
});

/* ===================== Start ===================== */
(function init(){
  const saved = store.get('ata_user', null);
  const j = PLAYERS.find(x => x.id === saved);
  if (j) { S.user = j; renderHome(true); retryPending(); } else renderLogin();
})();
</script>
</body>
</html>
